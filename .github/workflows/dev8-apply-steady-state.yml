name: Apply bounded Dev.8 steady-state correction
on:
  push:
    branches: [dev8-traversal-aa1-ownership]
    paths:
      - dev/dev8-steady-state-transform.sh
      - .github/workflows/dev8-apply-steady-state.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev8-traversal-aa1-ownership
          fetch-depth: 0
      - name: Apply exact bounded steady-state transform
        run: bash dev/dev8-steady-state-transform.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - name: Commit verified steady-state correction and clean staging machinery
        run: |
          set -euo pipefail
          git rm dev/dev8-steady-state-transform.sh .github/workflows/dev8-apply-steady-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/fixtureLighting.ts src/renderer/StaticWorldBatching.ts tests/dev8-runtime-diagnostics.test.mjs
          git commit -m "Suppress Dev.8 steady-state renderer no-op work"
          git fetch origin dev8-traversal-aa1-ownership
          git rebase origin/dev8-traversal-aa1-ownership
          git push origin HEAD:dev8-traversal-aa1-ownership
