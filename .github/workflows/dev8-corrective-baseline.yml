name: Dev.8 Corrective High Baseline
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Profile corrected High traversal baseline
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > /tmp/project-noclip-dev8-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/project-noclip-dev8-preview.log || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "Preview server did not become ready" >&2; exit 1; fi
            sleep 1
          done
          NOCLIP_DEV8_ARTIFACTS="artifacts/dev8-corrective" python scripts/dev8-corrective-profile.py | tee artifacts/dev8-corrective/workflow-report.log
      - name: Upload corrected Dev.8 baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev8-corrective-high-baseline-${{ github.sha }}
          path: artifacts/dev8-corrective
          if-no-files-found: warn
          retention-days: 30
