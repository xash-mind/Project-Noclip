name: Validate dev4 Region corridors
on:
  push:
    branches: [agent/dev4-world-coherence]
    paths: ['.github/workflows/dev4-run-gates4.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev4-world-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/dev4-world-coherence.test.mjs')
          t=p.read_text(encoding='utf-8')
          start=t.index('function transitionSides(seed, target) {')
          end=t.index('\nfunction wallWorld', start)
          helper="""function transitionSides(seed, target) {
            const occurrence = locateNearestRegion({ seed, originX: 0, originZ: 0, target, worldDay: 40, exposure: 10, tuning: DEFAULT_TUNING, maxDistanceMeters: 12_000 });
            assert.ok(occurrence, `missing ${target} occurrence for ${seed}`);
            const key = target === 'pillar-field' ? 'pillar' : 'arch';
            const exits = [];
            const directions = Array.from({ length: 24 }, (_, index) => {
              const angle = index / 24 * Math.PI * 2;
              return { x: Math.cos(angle), z: Math.sin(angle) };
            });
            for (const direction of directions) {
              const startStrength = sampleGen3RegionInfluence(seed, occurrence.worldX, occurrence.worldZ, 40, 10, DEFAULT_TUNING)[key];
              let lastInside = startStrength >= 0.18 ? { x: occurrence.worldX, z: occurrence.worldZ, strength: startStrength } : undefined;
              for (let distance = 28; distance <= 16_000; distance += 28) {
                const point = { x: occurrence.worldX + direction.x * distance, z: occurrence.worldZ + direction.z * distance };
                const strength = sampleGen3RegionInfluence(seed, point.x, point.z, 40, 10, DEFAULT_TUNING)[key];
                if (strength >= 0.18) lastInside = { ...point, strength };
                if (strength < 0.08 && lastInside) {
                  exits.push({ inside: { x: lastInside.x, z: lastInside.z }, outside: point, insideStrength: lastInside.strength, outsideStrength: strength });
                  break;
                }
              }
              if (exits.length >= 2) break;
            }
            assert.ok(exits.length >= 2, `${target} did not expose two finite blend exits`);
            return exits.slice(0, 2);
          }

          function transitionCorridor(seed, start, end, tuning) {
            const paddingCells = 3;
            const minCellX = Math.min(worldToCell(start.x), worldToCell(end.x)) - paddingCells;
            const maxCellX = Math.max(worldToCell(start.x), worldToCell(end.x)) + paddingCells;
            const minCellZ = Math.min(worldToCell(start.z), worldToCell(end.z)) - paddingCells;
            const maxCellZ = Math.max(worldToCell(start.z), worldToCell(end.z)) + paddingCells;
            const cells = [];
            for (let x = minCellX; x <= maxCellX; x += 1) for (let z = minCellZ; z <= maxCellZ; z += 1) cells.push(cell(seed, x, z, tuning));
            return cells;
          }
          """
          t=t[:start]+helper+t[end:]
          marker="      const center = { x: (exit.inside.x + exit.outside.x) / 2, z: (exit.inside.z + exit.outside.z) / 2 };"
          a=t.index(marker)
          b=t.index("      assert.ok(canNavigate",a)
          replacement="""      const transitionTuning = { ...DEFAULT_TUNING, conditionOverride: 'clear', carverOverride: 'none', structureOverride: 'none', gateBypass: true };
              const cells = transitionCorridor(seed, exit.outside, exit.inside, transitionTuning);
          """
          t=t[:a]+replacement+t[b:]
          p.write_text(t,encoding='utf-8')

          source=Path('.github/workflows/dev4-gates-patch.yml').read_text(encoding='utf-8')
          script=source.split('        run: |\n',1)[1]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())+'\n'
          script=script.replace(
            "Path('.github/workflows/dev4-gates-patch.yml').unlink()",
            "Path('.github/workflows/dev4-gates-patch.yml').unlink(); Path('.github/workflows/dev4-run-gates.yml').unlink(); Path('.github/workflows/dev4-run-gates2.yml').unlink(); Path('.github/workflows/dev4-run-gates3.yml').unlink(); Path('.github/workflows/dev4-run-gates4.yml').unlink()"
          )
          script=script.replace(
            "git add src tests scripts .github/workflows/dev4-gates-patch.yml",
            "git add src tests scripts .github/workflows/dev4-gates-patch.yml .github/workflows/dev4-run-gates.yml .github/workflows/dev4-run-gates2.yml .github/workflows/dev4-run-gates3.yml .github/workflows/dev4-run-gates4.yml"
          )
          Path('/tmp/dev4-gates.sh').write_text(script,encoding='utf-8')
          PY
          bash /tmp/dev4-gates.sh
