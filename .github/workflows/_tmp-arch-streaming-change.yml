name: Temporary Arch Streaming Change

on:
  push:
    branches:
      - cleanup/codebase-maintainability-2026-08-14

permissions:
  contents: write

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded candidate
        run: |
          python scripts/_tmp_apply_arch_streaming_change.py
          python scripts/_tmp_fix_arch_streaming_tests.py
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Benchmark
        run: npm run benchmark
      - name: Production build
        run: npm run build
      - name: Commit verified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: refine arch rooms and stream cells smoothly"
          git push origin HEAD:cleanup/codebase-maintainability-2026-08-14
