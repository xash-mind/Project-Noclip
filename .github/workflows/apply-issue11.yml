name: Apply Issue 11 source bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-11-sensory-modular-generation
          fetch-depth: 0
      - name: Verify and apply bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .staging/ready
          test "$(cat .staging/ready)" = "10346cdaef70117b7a96ffe690d4b14287ad6581c675ca9be5b3cbb3edb906e6"
          cat > /tmp/expected-parts.sha256 <<'EOF'
          3c6b0cbd716c839a37d49b6339075ae0657a8d52dba01b468195f37f62e826ce  .staging/part-000.b64
          1fbb99ef16c7349499f35d1320d1d33767ee94c11cb309d48114c1ed5ce807fa  .staging/part-001.b64
          df4955183036c9963a7fc8fb8b3c93e8b9f6991442f4957c3756116cfcbb7245  .staging/part-002.b64
          c100687e31b9201567a6cd305635d8874839dfe5af8d36169b58cb433ab657fc  .staging/part-003.b64
          4466047419d9e9a45b03c3af68a4c18c08f55504aa01bf823af629f217ee655e  .staging/part-004.b64
          5e4c54834c218891deb19cc30c63e660ab18f1895426c1af70a390c6d95e7ec8  .staging/part-005.b64
          7ea8cf6378d3b6f5381fdfc416f1ae731513dccd06573362710cb84401a673e5  .staging/part-006.b64
          EOF
          wc -c .staging/part-*.b64
          sha256sum .staging/part-*.b64
          sha256sum --check --strict /tmp/expected-parts.sha256
          cat .staging/part-*.b64 | base64 --decode > /tmp/issue11-change.tar.gz
          echo "10346cdaef70117b7a96ffe690d4b14287ad6581c675ca9be5b3cbb3edb906e6  /tmp/issue11-change.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/issue11-change.tar.gz -C .
          rm -rf .staging
          rm -f .github/workflows/source-snapshot.yml .github/workflows/apply-issue11.yml
      - name: Commit coherent implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "project-noclip-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Level 0 sensory simulation and modular generation"
          git push origin HEAD:agent/issue-11-sensory-modular-generation
