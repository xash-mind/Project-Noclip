name: Dev.9.4 Exact Candidate Verification

on:
  push:
    branches:
      - preview/dev9-4-presentation-corrections
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Full deterministic and system suite
        run: npm test
      - name: 10,000-Cell benchmark
        run: |
          mkdir -p artifacts/dev9-4-exact
          npm run benchmark | tee artifacts/dev9-4-exact/benchmark.log
      - name: Production build
        run: npm run build
      - name: Resolve visual targets
        run: |
          mkdir -p artifacts/dev9-4-exact/visual artifacts/dev9-4-exact/fidelity artifacts/dev9-4-exact/wallpaper artifacts/dev9-4-exact/flashlight artifacts/dev9-4-exact/browser artifacts/dev9-4-exact/mobile artifacts/dev9-4-exact/cohesion artifacts/dev9-4-exact/renderer artifacts/dev9-4-exact/traversal
          npx tsc -p tsconfig.test.json
          node scripts/visual-targets.mjs > artifacts/dev9-4-exact/visual/targets.json
      - name: Exact-head browser, visual and gameplay verification
        shell: bash
        env:
          NOCLIP_EXPECTED_VERSION: 0.3.0-dev.9.4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          npm run preview > /tmp/project-noclip-dev9-4-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/project-noclip-dev9-4-preview.log || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "Preview server did not become ready" >&2; exit 1; fi
            sleep 1
          done

          NOCLIP_VERSION_ARTIFACTS="artifacts/dev9-4-exact/browser" python scripts/version-smoke.py
          NOCLIP_MOBILE_ARTIFACTS="artifacts/dev9-4-exact/mobile" python scripts/mobile-smoke.py
          NOCLIP_BROWSER_ARTIFACTS="artifacts/dev9-4-exact/browser" python scripts/browser-smoke.py
          NOCLIP_WORLD_COHESION_ARTIFACTS="artifacts/dev9-4-exact/cohesion" python scripts/world-cohesion-smoke.py
          NOCLIP_VISUAL_TARGETS="artifacts/dev9-4-exact/visual/targets.json" NOCLIP_VISUAL_ARTIFACTS="artifacts/dev9-4-exact/visual" python scripts/visual-smoke.py
          NOCLIP_FIDELITY_ARTIFACTS="artifacts/dev9-4-exact/fidelity" python scripts/fidelity-smoke.py
          NOCLIP_WALLPAPER_ARTIFACTS="artifacts/dev9-4-exact/wallpaper" python scripts/wallpaper-presentation-smoke.py
          NOCLIP_FLASHLIGHT_ARTIFACTS="artifacts/dev9-4-exact/flashlight" python scripts/flashlight-smoke.py

          NOCLIP_BASE_URL="http://127.0.0.1:4173" \
          NOCLIP_DEPLOYMENT_COMMIT="$CANDIDATE_SHA" \
          NOCLIP_DEPLOYMENT_ID="dev9-4-exact-candidate" \
          NOCLIP_EXPECTED_VERSION="v0.3.0-dev.9.4" \
          NOCLIP_PROFILE_ARTIFACTS="artifacts/dev9-4-exact/renderer" \
          python scripts/profile-candidate-renderer.py

          NOCLIP_BASE_URL="http://127.0.0.1:4173" \
          NOCLIP_DEV8_ARTIFACTS="artifacts/dev9-4-exact/traversal" \
          python scripts/dev8-corrective-profile.py | tee artifacts/dev9-4-exact/traversal/workflow-report.log

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = json.loads(Path('artifacts/dev9-4-exact/renderer/profile.json').read_text(encoding='utf-8'))
          assert profile['deployment']['commit'] == os.environ['CANDIDATE_SHA']
          assert profile['deployment']['version'] == 'v0.3.0-dev.9.4'
          assert not profile.get('browserErrors'), profile.get('browserErrors')
          caps = {
              'defaultSpawn': {'loadedCells': 49, 'drawCalls': 220, 'colliders': 1200, 'interactions': 160},
              'holeCarverRadius1': {'loadedCells': 9, 'drawCalls': 220, 'colliders': 600, 'interactions': 120},
              'worldLabShowcase': {'loadedCells': 49, 'drawCalls': 280, 'colliders': 1400, 'interactions': 260},
          }
          for key, limits in caps.items():
              metrics = profile['scenarios'][key]['worldMetricsAfter']
              assert int(metrics['loadedCells']) == limits['loadedCells'], (key, metrics)
              assert metrics.get('generation') == 'gen3-v1', (key, metrics)
              for metric in ('drawCalls', 'colliders', 'interactions'):
                  assert int(metrics[metric]) <= limits[metric], (key, metric, metrics[metric], limits[metric])
              assert int(metrics.get('activeOmnis') or 0) == int(metrics.get('shadowedOmnis') or 0), (key, metrics)
          print('Exact-head renderer caps and 1:1 active-light/shadow invariant PASS')
          PY
      - name: Upload exact Dev.9.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev9-4-exact-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/dev9-4-exact
          if-no-files-found: warn
          retention-days: 30
