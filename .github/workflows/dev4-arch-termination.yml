name: Fix dev4 Arch termination ownership
on:
  push:
    branches: [agent/dev4-world-coherence]
    paths: ['.github/workflows/dev4-arch-termination.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev4-world-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/world/gen3Architecture.ts')
          t=p.read_text(encoding='utf-8')
          old="""  add('lower', spec.start, spec.end, 0.5, 1.0);
            add('header', spec.start, spec.end, 2.98, 0.44);

            const asymmetry = spec.irregular ? (unitFloat(`${seed}:gen3-v4:arch-divider:${spec.id}:asymmetry`) - 0.5) * 0.14 : 0;
            for (let bayIndex = 0; bayIndex < spec.bayCount; bayIndex += 1) {
          """
          new="""  const asymmetry = spec.irregular ? (unitFloat(`${seed}:gen3-v4:arch-divider:${spec.id}:asymmetry`) - 0.5) * 0.14 : 0;
            const terminationSide = Math.min(0.54, spec.bayWidth * 0.16);
            const leftTermination = terminationSide * (1 + asymmetry);
            const rightTermination = terminationSide * (1 - asymmetry);
            add('lower', spec.start + leftTermination, spec.end - rightTermination, 0.5, 1.0);
            add('header', spec.start + leftTermination, spec.end - rightTermination, 2.98, 0.44);
            add('left-termination', spec.start, spec.start + leftTermination, WALL_HEIGHT / 2, WALL_HEIGHT);
            add('right-termination', spec.end - rightTermination, spec.end, WALL_HEIGHT / 2, WALL_HEIGHT);

            for (let bayIndex = 0; bayIndex < spec.bayCount; bayIndex += 1) {
          """
          if old not in t: raise SystemExit('Arch header/termination anchor missing')
          t=t.replace(old,new,1)
          t=t.replace("    if (bayIndex === 0) add(`bay:${bayIndex}:left-termination`, bayStart, bayStart + leftSide, WALL_HEIGHT / 2, WALL_HEIGHT);\n    else {", "    if (bayIndex > 0) {",1)
          t=t.replace("    if (bayIndex === spec.bayCount - 1) add(`bay:${bayIndex}:right-termination`, bayEnd - rightSide, bayEnd, WALL_HEIGHT / 2, WALL_HEIGHT);\n    else {", "    if (bayIndex < spec.bayCount - 1) {",1)
          p.write_text(t,encoding='utf-8')
          Path('.github/workflows/dev4-arch-termination.yml').unlink()
          PY
          npm install --no-audit --no-fund
          npm run typecheck
          git config user.name "xash-mind"
          git config user.email "sashreeksagar5@gmail.com"
          git add src .github/workflows/dev4-arch-termination.yml
          git commit -m "fix: terminate Arch dividers without overlapping solids"
          git push origin HEAD:agent/dev4-world-coherence
