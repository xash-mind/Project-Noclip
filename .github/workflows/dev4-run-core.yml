name: Run corrected dev4 core integration
on:
  push:
    branches: [agent/dev4-world-coherence]
    paths: ['.github/workflows/dev4-run-core.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev4-world-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute corrected integration script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/dev4-apply-core3.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          script = source.split(marker, 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines()) + '\n'
          script = script.replace(
              "result.diffuseMapOffset = new pc.Vec2(uvOffset[0], uvOffset[1]);",
              "(result as unknown as { diffuseMapOffset: pc.Vec2 }).diffuseMapOffset = new pc.Vec2(uvOffset[0], uvOffset[1]);"
          )
          script = script.replace(
              "'.github/workflows/dev4-apply-core3.yml']",
              "'.github/workflows/dev4-apply-core3.yml','.github/workflows/dev4-run-core.yml']"
          )
          Path('/tmp/dev4-core.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/dev4-core.sh
