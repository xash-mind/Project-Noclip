name: Apply deep Pillar distribution fix
on:
  push:
    branches: [agent/dev4-world-coherence]
    paths: ['.github/workflows/dev4-deep-pillar-retry.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev4-world-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/world/gen3Architecture.ts')
          t=p.read_text(encoding='utf-8')
          old="""  const deepPillar = pillar
            * strength(pillar, 0.82, 0.98)
            * strength(local.openness, 0.66, 0.9)
            * strength(local.regularity, 0.68, 0.9)
            * strength(local.columnPressure, 0.62, 0.88);
          return { pillar, arch, deepPillar: clamp01(deepPillar) };
          """
          new="""  // Deep Pillar territory is a rare continuous extreme inside an otherwise mixed
          // Pillar Region. A smooth combined potential keeps the extreme spatially coherent
          // without requiring three separate high-tail Fields to coincide.
          const deepPotential = local.openness * 0.45 + local.regularity * 0.35 + local.columnPressure * 0.2;
          const deepPillar = strength(pillar, 0.72, 0.96) * strength(deepPotential, 0.64, 0.84);
          return { pillar, arch, deepPillar: clamp01(deepPillar) };
          """
          if old not in t: raise SystemExit('deep Pillar formula anchor missing')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          for f in ['.github/workflows/dev4-deep-pillar.yml','.github/workflows/dev4-deep-pillar-retry.yml']:
            q=Path(f)
            if q.exists(): q.unlink()
          PY
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run benchmark
          git config user.name "xash-mind"
          git config user.email "sashreeksagar5@gmail.com"
          git add src .github/workflows/dev4-deep-pillar.yml .github/workflows/dev4-deep-pillar-retry.yml
          git commit -m "fix: preserve rare deep Pillar extremes"
          git push origin HEAD:agent/dev4-world-coherence
