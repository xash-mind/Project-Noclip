name: Dev.9.5 Wallpaper Audit
on:
  pull_request:
    paths:
      - 'scripts/wallpaper-presentation-smoke.py'
      - 'src/renderer/ordinaryWallpaperPresentation.ts'
      - 'src/renderer/ordinaryWallpaperAssets.ts'
      - 'src/renderer/level0SurfacePresentation.ts'
      - 'src/main.ts'
      - '.github/workflows/dev9-5-wallpaper-audit.yml'
permissions:
  contents: read
jobs:
  wallpaper-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Run wallpaper browser audit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/dev9-5-wallpaper-audit
          npm run preview > /tmp/project-noclip-dev9-5-wallpaper.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/project-noclip-dev9-5-wallpaper.log || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          STATUS=0
          NOCLIP_WALLPAPER_ARTIFACTS="artifacts/dev9-5-wallpaper-audit" python scripts/wallpaper-presentation-smoke.py || STATUS=$?
          exit "$STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev9-5-wallpaper-audit-${{ github.event.pull_request.head.sha }}
          path: artifacts/dev9-5-wallpaper-audit
          if-no-files-found: warn
          retention-days: 7
