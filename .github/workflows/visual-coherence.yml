name: Project Noclip Visual Coherence
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  visual-coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - name: Install browser driver
        run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Resolve deterministic visual targets
        run: |
          mkdir -p artifacts/dev4-visual artifacts/dev5-fidelity
          npx tsc -p tsconfig.test.json
          node scripts/dev4-visual-targets.mjs > artifacts/dev4-visual/targets.json
      - name: Capture close-range world and dev.5 fidelity evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > /tmp/project-noclip-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/project-noclip-preview.log || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          NOCLIP_DEV4_TARGETS="artifacts/dev4-visual/targets.json" \
          NOCLIP_DEV4_VISUAL_ARTIFACTS="artifacts/dev4-visual" \
          python scripts/dev4-visual-smoke.py
          NOCLIP_DEV5_FIDELITY_ARTIFACTS="artifacts/dev5-fidelity" \
          python scripts/dev5-fidelity-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev5-visual-coherence-${{ github.sha }}
          path: |
            artifacts/dev4-visual
            artifacts/dev5-fidelity
          retention-days: 30
