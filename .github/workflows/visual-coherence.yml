name: Project Noclip Visual Coherence

on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  visual-coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - name: Install browser driver
        run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Resolve deterministic visual targets
        run: |
          mkdir -p artifacts/visual artifacts/fidelity artifacts/arch-ownership artifacts/flashlight artifacts/lighting-finalization artifacts/fixture-finalization artifacts/render-settings
          npx tsc -p tsconfig.test.json
          node scripts/visual-targets.mjs > artifacts/visual/targets.json
      - name: Run blocking Dev.8 world and fidelity evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > /tmp/project-noclip-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/project-noclip-preview.log || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done

          # Dev.8 is a clean post-PAU recovery checkpoint, not a visual-retuning
          # release. Keep deterministic world/Region presentation and broad
          # fidelity browser coverage blocking here. Fine-grained screenshot,
          # pulse-timing and luminance calibrations are collected separately
          # below because they are runner-sensitive and belong to later visual
          # tuning rather than this rollback boundary.
          NOCLIP_VISUAL_TARGETS="artifacts/visual/targets.json" \
          NOCLIP_VISUAL_ARTIFACTS="artifacts/visual" \
          python scripts/visual-smoke.py

          NOCLIP_FIDELITY_ARTIFACTS="artifacts/fidelity" \
          python scripts/fidelity-smoke.py

          # Physical testing falsified the old final-frame-only Arch acceptance.
          # Keep the locate lifecycle itself blocking: capture the same A-A1
          # overview on the immediate, early and settled frames after repeated
          # Ordinary -> Arch Region locating, then require a runtime-clear route.
          NOCLIP_ARCH_OWNERSHIP_ARTIFACTS="artifacts/arch-ownership" \
          python scripts/arch-ownership-smoke.py

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Collect legacy visual calibration diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          npm run preview > /tmp/project-noclip-calibration-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/project-noclip-calibration-preview.log || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done

          STATUS=0
          run_evidence() {
            echo "::group::$1"
            shift
            "$@" || STATUS=1
            echo "::endgroup::"
          }

          run_evidence "Render settings profile" env \
            NOCLIP_RENDER_SETTINGS_ARTIFACTS="artifacts/render-settings" \
            python scripts/profile-render-settings.py
          run_evidence "Fixture finalization" env \
            NOCLIP_FIXTURE_FINALIZATION_ARTIFACTS="artifacts/fixture-finalization" \
            python scripts/fixture-finalization-smoke.py
          run_evidence "Flashlight smoke" env \
            NOCLIP_FLASHLIGHT_ARTIFACTS="artifacts/flashlight" \
            python scripts/flashlight-smoke.py
          run_evidence "Legacy lighting finalization" env \
            NOCLIP_LIGHTING_FINALIZATION_ARTIFACTS="artifacts/lighting-finalization" \
            python scripts/lighting-finalization-smoke.py

          # Preserve the diagnostics and their exit signal in the logs/artifacts,
          # but do not force Level 0 or lighting retuning during a recovery release.
          echo "Legacy calibration diagnostic status: ${STATUS}"
          exit "$STATUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-coherence-${{ github.sha }}
          path: |
            artifacts/visual
            artifacts/fidelity
            artifacts/arch-ownership
            artifacts/flashlight
            artifacts/lighting-finalization
            artifacts/fixture-finalization
            artifacts/render-settings
          retention-days: 30
