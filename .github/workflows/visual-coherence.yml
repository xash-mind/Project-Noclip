name: Project Noclip Visual Coherence

on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  visual-coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - name: Install browser driver
        run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Resolve deterministic visual targets
        run: |
          mkdir -p artifacts/visual artifacts/fidelity artifacts/flashlight artifacts/lighting-finalization
          npx tsc -p tsconfig.test.json
          node scripts/visual-targets.mjs > artifacts/visual/targets.json
      - name: Capture close-range world, Region and flashlight evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > /tmp/project-noclip-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/project-noclip-preview.log || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          NOCLIP_VISUAL_TARGETS="artifacts/visual/targets.json" \
          NOCLIP_VISUAL_ARTIFACTS="artifacts/visual" \
          python scripts/visual-smoke.py
          NOCLIP_FLASHLIGHT_ARTIFACTS="artifacts/flashlight" \
          python scripts/flashlight-smoke.py
          NOCLIP_FIDELITY_ARTIFACTS="artifacts/fidelity" \
          python scripts/fidelity-smoke.py
          NOCLIP_LIGHTING_FINALIZATION_ARTIFACTS="artifacts/lighting-finalization" \
          python scripts/lighting-finalization-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-coherence-${{ github.sha }}
          path: |
            artifacts/visual
            artifacts/fidelity
            artifacts/flashlight
            artifacts/lighting-finalization
          retention-days: 30
