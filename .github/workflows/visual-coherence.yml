name: Project Noclip Visual Coherence

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/visual-coherence.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/visual-coherence.yml'

permissions:
  contents: read

jobs:
  visual-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - name: Install browser driver
        run: python3 -m pip install --disable-pip-version-check selenium==4.29.0
      - name: Resolve deterministic visual targets
        run: |
          mkdir -p artifacts/visual artifacts/fidelity artifacts/flashlight
          node scripts/visual-targets.mjs > artifacts/visual/targets.json
      - name: Capture close-range world, Region and flashlight evidence
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/project-noclip-visual-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          NOCLIP_BASE_URL=http://127.0.0.1:4173 NOCLIP_VISUAL_TARGETS=artifacts/visual/targets.json NOCLIP_VISUAL_ARTIFACTS=artifacts/visual python3 scripts/visual-smoke.py
          NOCLIP_BASE_URL=http://127.0.0.1:4173 NOCLIP_FLASHLIGHT_ARTIFACTS=artifacts/flashlight python3 scripts/flashlight-smoke.py
          NOCLIP_BASE_URL=http://127.0.0.1:4173 NOCLIP_FIDELITY_ARTIFACTS=artifacts/fidelity python3 scripts/fidelity-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: visual-coherence-${{ github.sha }}
          path: |
            artifacts/visual
            artifacts/fidelity
            artifacts/flashlight
          if-no-files-found: error
          retention-days: 14
