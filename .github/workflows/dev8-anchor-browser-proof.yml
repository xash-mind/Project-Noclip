name: Dev.8 Exact Anchor Browser Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-anchor-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/dev8-post-pau-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve strengthened locator harness and checkout exact anchor
        shell: bash
        run: |
          cp scripts/world-cohesion-smoke.py /tmp/dev8-world-cohesion-smoke.py
          git checkout --detach 4e96157bb9a85564ff9ab381ce19370fe0f3373d
      - run: npm install --no-audit --no-fund
      - name: Build exact anchor
        run: npm run build
      - name: Install browser driver
        run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Run exact-anchor repeated Region locator smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > /tmp/project-noclip-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/project-noclip-preview.log || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          NOCLIP_COHESION_ARTIFACTS="artifacts/dev8-exact-anchor-browser" python /tmp/dev8-world-cohesion-smoke.py
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
      - name: Upload exact-anchor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev8-exact-anchor-browser-${{ github.sha }}
          path: artifacts/dev8-exact-anchor-browser
          if-no-files-found: error
          retention-days: 30
