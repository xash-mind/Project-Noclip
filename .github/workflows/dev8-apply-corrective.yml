name: Apply bounded Dev.8 corrective patch
on:
  push:
    branches: [dev8-traversal-aa1-ownership]
    paths:
      - dev/dev8-corrective.patch
      - .github/workflows/dev8-apply-corrective.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev8-traversal-aa1-ownership
          fetch-depth: 0
      - name: Apply bounded source transforms
        run: bash dev/dev8-corrective.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Commit verified bounded patch and remove staging files
        run: |
          set -euo pipefail
          git rm dev/dev8-corrective.patch .github/workflows/dev8-apply-corrective.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/level0RegionPresentation.ts src/renderer/streamingScheduler.ts tests/dev8-corrective.test.mjs
          git commit -m "Correct Dev.8 A-A1 ownership and streaming admission"
          git push origin HEAD:dev8-traversal-aa1-ownership
