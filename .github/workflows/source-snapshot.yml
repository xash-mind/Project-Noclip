name: Temporary source snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source tree
        run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf project-noclip-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: project-noclip-source-${{ github.event.pull_request.head.sha }}
          path: project-noclip-source.tar.gz
          retention-days: 1
