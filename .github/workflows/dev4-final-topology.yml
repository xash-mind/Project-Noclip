name: Finalize dev4 local topology
on:
  push:
    branches: [agent/dev4-world-coherence]
    paths: ['.github/workflows/dev4-final-topology.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev4-world-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/world/gen3Architecture.ts')
          t=p.read_text(encoding='utf-8')
          old="""function baseKeepChance(fields: Fields, axis: 'x' | 'z', influence: Gen3RegionInfluence): number {
            const roomMerge = fields.openness * 0.16 + fields.roomScale * 0.12;
            const pressure = fields.partitionPressure * 0.2;
            const flow = (fields.axisFlow - 0.5) * (axis === 'z' ? 0.1 : -0.1);
            const pillarSuppression = influence.pillar * 0.12 + influence.deepPillar * 0.5;
            const archOrder = influence.arch * fields.regularity * 0.05;
            return clamp01(0.72 + pressure - roomMerge + flow + archOrder - pillarSuppression);
          }
          """
          new="""function baseKeepChance(fields: Fields, axis: 'x' | 'z', influence: Gen3RegionInfluence): number {
            const ordinaryMerge = fields.openness * 0.08 + fields.roomScale * 0.06;
            const rareLargeSpace = strength(fields.openness, 0.78, 0.94) * strength(fields.roomScale, 0.72, 0.92) * 0.32;
            const pressure = fields.partitionPressure * 0.16;
            const flow = (fields.axisFlow - 0.5) * (axis === 'z' ? 0.08 : -0.08);
            const pillarSuppression = influence.pillar * 0.12 + influence.deepPillar * 0.5;
            const archOrder = influence.arch * fields.regularity * 0.05;
            return clamp01(0.76 + pressure - ordinaryMerge - rareLargeSpace + flow + archOrder - pillarSuppression);
          }
          """
          if old not in t: raise SystemExit('baseKeepChance anchor missing')
          t=t.replace(old,new,1)
          old="""  const neighborSupport = (Number(previous) + Number(next)) / 2;
            const coherent = clamp01(base + (neighborSupport - 0.5) * fields.regularity * 0.16);
            return unitFloat(`${seed}:gen3-v4:wall:${axis}:${lineIndex}:${alongIndex}`) < coherent;
          }
          """
          new="""  const neighborCount = Number(previous) + Number(next);
            const runBreaker = neighborCount === 0 ? 0.14 : neighborCount === 2 ? -0.06 : 0;
            const coherent = clamp01(base + runBreaker * (0.7 + fields.regularity * 0.3));
            return unitFloat(`${seed}:gen3-v4:wall:${axis}:${lineIndex}:${alongIndex}`) < coherent;
          }
          """
          if old not in t: raise SystemExit('segmentKept anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          Path('.github/workflows/dev4-final-topology.yml').unlink()
          PY
          npm install --no-audit --no-fund
          npm run typecheck
          git config user.name "xash-mind"
          git config user.email "sashreeksagar5@gmail.com"
          git add src .github/workflows/dev4-final-topology.yml
          git commit -m "fix: balance room scale and sightlines"
          git push origin HEAD:agent/dev4-world-coherence
