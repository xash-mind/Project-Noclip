name: Run corrected dev4 topology tuning
on:
  push:
    branches: [agent/dev4-world-coherence]
    paths: ['.github/workflows/dev4-run-tune.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev4-world-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute corrected tuning script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/dev4-tune-topology.yml').read_text(encoding='utf-8')
          script = source.split('        run: |\n', 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines()) + '\n'
          script = script.replace(
              "old = \"\"\"  if (centerInfluence.arch > 0.46 && centerInfluence.arch >= centerInfluence.pillar) conditionIds.push('deep-wet-carpet');\n  else if (centerInfluence.pillar > 0.38) conditionIds.push('shallow-dry-carpet');\n  else conditionIds.push('damp-carpet');\n\"\"\"",
              "old = \"\"\"if (centerInfluence.arch > 0.46 && centerInfluence.arch >= centerInfluence.pillar) conditionIds.push('deep-wet-carpet');\nelse if (centerInfluence.pillar > 0.38) conditionIds.push('shallow-dry-carpet');\nelse conditionIds.push('damp-carpet');\n\"\"\""
          )
          script = script.replace(
              "new = old + \"  if (environment.blackoutStrength >= 0.999 && !conditionIds.includes('blackout')) conditionIds.push('blackout');\\n\"",
              "new = old + \"if (environment.blackoutStrength >= 0.999 && !conditionIds.includes('blackout')) conditionIds.push('blackout');\\n\""
          )
          script = script.replace(
              "Path('.github/workflows/dev4-tune-topology.yml').unlink()",
              "Path('.github/workflows/dev4-tune-topology.yml').unlink(); Path('.github/workflows/dev4-run-tune.yml').unlink()"
          )
          Path('/tmp/dev4-tune.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/dev4-tune.sh
