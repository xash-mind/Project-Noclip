name: Calibrate rare deep Pillar cores
on:
  push:
    branches: [agent/dev4-world-coherence]
    paths: ['.github/workflows/dev4-deep-pillar-final.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev4-world-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/world/gen3Architecture.ts')
          t=p.read_text(encoding='utf-8')
          start=t.index('  const deepPillar = pillar', t.index('function regionInfluenceFromLocal'))
          end=t.index('  return { pillar, arch, deepPillar: clamp01(deepPillar) };', start)
          end=t.index('\n', end)+1
          replacement="""  // Deep Pillar territory is a rare continuous extreme inside an otherwise mixed
            // Pillar Region. A smooth combined potential produces coherent deep cores without
            // making the common Pillar experience a near-pure lattice.
            const deepPotential = local.openness * 0.45 + local.regularity * 0.35 + local.columnPressure * 0.2;
            const deepPillar = strength(pillar, 0.66, 0.92) * strength(deepPotential, 0.56, 0.76);
            return { pillar, arch, deepPillar: clamp01(deepPillar) };
          """
          p.write_text(t[:start]+replacement+t[end:],encoding='utf-8')
          for f in ['.github/workflows/dev4-deep-pillar.yml','.github/workflows/dev4-deep-pillar-retry.yml','.github/workflows/dev4-deep-pillar-apply.yml','.github/workflows/dev4-deep-pillar-final.yml']:
            q=Path(f)
            if q.exists(): q.unlink()
          PY
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run benchmark
          git config user.name "xash-mind"
          git config user.email "sashreeksagar5@gmail.com"
          git add src .github/workflows
          git commit -m "fix: preserve rare deep Pillar extremes"
          git push origin HEAD:agent/dev4-world-coherence
