name: Dev.8 Mobile Smoke Refinement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/dev8-post-pau-recovery
      - name: Refine mobile World Lab close assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/mobile-smoke.py')
          text = path.read_text(encoding='utf-8')
          old = '''def click_visible_control(driver: webdriver.Chrome, selector: str) -> None:\n    \"\"\"Activate a visible control whose center hit-test is unstable under CDP mobile emulation.\"\"\"\n    button = driver.find_element(By.CSS_SELECTOR, selector)\n    assert button.is_displayed(), f\"{selector} is not visible\"\n    driver.execute_script(\"arguments[0].click();\", button)\n'''
          new = '''def click_visible_control(driver: webdriver.Chrome, selector: str) -> None:\n    \"\"\"Activate an on-screen control when Selenium visibility/hit-testing drifts under CDP emulation.\"\"\"\n    button = driver.find_element(By.CSS_SELECTOR, selector)\n    rect = element_rect(driver, selector)\n    viewport = driver.execute_script(\"return {width: innerWidth, height: innerHeight};\")\n    assert rect[\"width\"] > 0 and rect[\"height\"] > 0, (selector, rect)\n    assert rect[\"right\"] > 0 and rect[\"bottom\"] > 0 and rect[\"left\"] < float(viewport[\"width\"]) and rect[\"top\"] < float(viewport[\"height\"]), (selector, rect, viewport)\n    driver.execute_script(\"arguments[0].click();\", button)\n'''
          if old not in text:
              raise SystemExit('expected mobile helper block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mobile-smoke.py
          git commit -m "Use on-screen geometry for mobile Lab close smoke"
          git push origin HEAD:release/dev8-post-pau-recovery
