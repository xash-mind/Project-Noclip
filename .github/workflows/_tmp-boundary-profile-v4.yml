name: Temporary Boundary Profile V4
on:
  push:
    branches: [cleanup/codebase-maintainability-2026-08-14]
permissions:
  contents: write
jobs:
  profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Prepare exact instrumented revisions
        run: |
          git worktree add /tmp/noclip-before 2a183c9cdcd9ad4089e0f4261e276ae82a8efc23
          git worktree add /tmp/noclip-after 04d89e8a4b772efdcd817ceb19cf748b1198c760
          cp scripts/_tmp_boundary_profile_v4.py /tmp/profile.py
          python - <<'PY'
          from pathlib import Path
          import re
          roots=[(Path('/tmp/noclip-before'),'src/renderer/renderSettingsRuntime.ts'),(Path('/tmp/noclip-after'),'src/renderer/streamingScheduler.ts')]
          helper="""
          function profiledGenerateCell(options: Parameters<typeof generateCell>[0]): CellDescriptor {
            const started=performance.now(); const result=generateCell(options);
            const m=typeof window!=='undefined'?(window as unknown as {__streamProfileMetrics?:Record<string,number>}).__streamProfileMetrics:undefined;
            if(m){m.generateCalls=(m.generateCalls??0)+1;m.generateMs=(m.generateMs??0)+performance.now()-started;} return result;
          }
          """
          for root,gpath in roots:
            p=root/'src/main.ts';t=p.read_text();n='const game = new ProjectNoclipGame();\n';assert n in t;p.write_text(t.replace(n,n+"(window as unknown as { __testGame?: ProjectNoclipGame }).__testGame = game;\n",1))
            p=root/gpath;t=p.read_text();n='let installed = false;\n';assert n in t;t=t.replace(n,n+helper,1);assert 'generateCell({' in t;p.write_text(t.replace('generateCell({','profiledGenerateCell({'))
            p=root/'src/renderer/cellBuilder.ts';t=p.read_text();n='  buildCell(descriptor: CellDescriptor): CellVisual {\n';assert n in t;t=t.replace(n,n+'    const __cellStart=performance.now(); let __collisionMs=0; let __collisionCalls=0;\n',1)
            old='      const collider = this.toWorldCollider(descriptor, wallSpec);\n      colliders.push(collider); this.walls.set(collider.id, collider);\n';assert old in t;t=t.replace(old,'      const __collisionStart=performance.now();\n      const collider = this.toWorldCollider(descriptor, wallSpec);\n      colliders.push(collider); this.walls.set(collider.id, collider);\n      __collisionMs+=performance.now()-__collisionStart; __collisionCalls+=1;\n',1)
            old='    const interactions = this.addInteractions(descriptor, root);\n    return { descriptor, root, colliders, interactions };\n';assert old in t
            new="""    const interactions = this.addInteractions(descriptor, root);
            const __m=typeof window!=='undefined'?(window as unknown as {__streamProfileMetrics?:Record<string,number>}).__streamProfileMetrics:undefined;
            if(__m){__m.cellBuildCalls=(__m.cellBuildCalls??0)+1;__m.cellBuildMs=(__m.cellBuildMs??0)+performance.now()-__cellStart;__m.collisionRegistrationCalls=(__m.collisionRegistrationCalls??0)+__collisionCalls;__m.collisionRegistrationMs=(__m.collisionRegistrationMs??0)+__collisionMs;}
            return { descriptor, root, colliders, interactions };
          """;p.write_text(t.replace(old,new,1))
            p=root/'src/renderer/level0RegionPresentation.ts';t=p.read_text();t,c=re.subn(r'(function renderArchFrames\([^\n]+\): void \{\n)',r'\1  const __archStart=performance.now();\n',t,count=1);assert c==1
            mark='\n}\n\nfunction applyRegionPresentation(renderer: WorldRenderer, visual: CellVisual): void {';assert mark in t
            end="""
            const __am=typeof window!=='undefined'?(window as unknown as {__streamProfileMetrics?:Record<string,number>}).__streamProfileMetrics:undefined;
            if(__am){__am.archCalls=(__am.archCalls??0)+1;__am.archMs=(__am.archMs??0)+performance.now()-__archStart;}
          }

          function applyRegionPresentation(renderer: WorldRenderer, visual: CellVisual): void {""";p.write_text(t.replace(mark,'\n'+end,1))
            p=root/'src/renderer/fixtureLighting.ts';t=p.read_text();n='function attachFixtureLights(renderer: WorldRenderer, visual: CellVisual): void {\n';assert n in t;t=t.replace(n,n+'  const __fixtureStart=performance.now();\n',1)
            mark='  markFixtureShadowsDirtyNearCell(state, descriptor);\n}\n\nfunction detachCellFixtures';assert mark in t
            end="""  markFixtureShadowsDirtyNearCell(state, descriptor);
            const __fm=typeof window!=='undefined'?(window as unknown as {__streamProfileMetrics?:Record<string,number>}).__streamProfileMetrics:undefined;
            if(__fm){__fm.fixtureAttachCalls=(__fm.fixtureAttachCalls??0)+1;__fm.fixtureAttachMs=(__fm.fixtureAttachMs??0)+performance.now()-__fixtureStart;}
          }

          function detachCellFixtures""";p.write_text(t.replace(mark,end,1))
            p=root/'src/renderer/StaticWorldBatching.ts';t=p.read_text();n='  const reconcile = (): void => {\n';assert n in t;t=t.replace(n,'  const reconcileUnprofiled = (): void => {\n',1)
            pattern=r'(  };\n)(\n?  reconcile\(\);\n  window\.setInterval\(reconcile, RECONCILE_INTERVAL_MS\);)'
            wrapper="""  };
            const reconcile=():void=>{const __batchStart=performance.now();reconcileUnprofiled();const __bm=typeof window!=='undefined'?(window as unknown as {__streamProfileMetrics?:Record<string,number>}).__streamProfileMetrics:undefined;if(__bm){__bm.staticBatchCalls=(__bm.staticBatchCalls??0)+1;__bm.staticBatchMs=(__bm.staticBatchMs??0)+performance.now()-__batchStart;}};
            reconcile();
            window.setInterval(reconcile, RECONCILE_INTERVAL_MS);"""
            t,c=re.subn(pattern,wrapper,t,count=1);assert c==1;p.write_text(t)
          PY
      - name: Build exact revisions
        run: |
          (cd /tmp/noclip-before && npm install --no-audit --no-fund && npm run typecheck && npm run build)
          (cd /tmp/noclip-after && npm install --no-audit --no-fund && npm run typecheck && npm run build)
      - name: Serve
        run: |
          (cd /tmp/noclip-before && PORT=4173 npm run preview >/tmp/before.log 2>&1 &)
          (cd /tmp/noclip-after && PORT=4174 npm run preview >/tmp/after.log 2>&1 &)
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && curl -fsS http://127.0.0.1:4174 >/dev/null && exit 0; sleep 1; done
          cat /tmp/before.log /tmp/after.log; exit 1
      - run: python -m pip install --disable-pip-version-check selenium
      - name: Profile
        run: python /tmp/profile.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: boundary-profile-v4, path: artifacts/boundary-profile-v4, if-no-files-found: warn}
      - name: Remove harness
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/_tmp-boundary-profile-v4.yml scripts/_tmp_boundary_profile_v4.py
          git commit -m "chore: remove robust boundary profiler"
          git push origin HEAD:cleanup/codebase-maintainability-2026-08-14
