name: Apply dev4 coherence core v3
on:
  push:
    branches: [agent/dev4-world-coherence]
    paths: ['.github/workflows/dev4-apply-core3.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev4-world-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Patch and typecheck
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def one(path, old, new):
              p=Path(path); t=p.read_text()
              if old not in t: raise RuntimeError(f'missing {path}: {old[:80]}')
              p.write_text(t.replace(old,new,1))

          # gen3
          p=Path('src/world/gen3.ts'); t=p.read_text()
          t=t.replace("import { stableId, unitFloat } from './hash.js';\n", "import { stableId, unitFloat } from './hash.js';\nimport { generateCoherentGen3Architecture, sampleGen3RegionInfluence } from './gen3Architecture.js';\n",1)
          a=t.index("  if (environment.regionId === 'arch-rooms') {"); b=t.index("  const cluster =",a)
          t=t[:a]+"""  const architecture = generateCoherentGen3Architecture({ seed, cellX, cellZ, worldDay, exposure, tuning });
          walls.push(...architecture.walls);
          props.push(...architecture.props);
          const centerInfluence = sampleGen3RegionInfluence(seed, cellX * CELL_SIZE, cellZ * CELL_SIZE, worldDay, exposure, tuning);
          if (walls.some((candidate) => candidate.materialId === 'arch-pale-wallpaper')) materialIds.push('arch-pale-wallpaper');
          if (centerInfluence.arch > 0.46 && centerInfluence.arch >= centerInfluence.pillar) conditionIds.push('deep-wet-carpet');
          else if (centerInfluence.pillar > 0.38) conditionIds.push('shallow-dry-carpet');
          else conditionIds.push('damp-carpet');

          """+t[b:]
          c=t.index("  const cluster =",a); d=t.index("  if (cluster)",c)
          t=t[:c]+"  const cluster = holeClusterForCell(seed, cellX, cellZ, worldDay, exposure, tuning);\n"+t[d:]
          t=t.replace("    `b${Math.round(environment.blackoutStrength * 4)}`\n", "    `b${Math.round(environment.blackoutStrength * 4)}`,\n    `a${architecture.archDividerIds.length}`,\n    `pi${architecture.pillarCount}`\n",1)
          p.write_text(t)

          # generator
          one('src/world/generator.ts', "import { generateGen3Layout, sampleGen3Environment } from './gen3.js';\n", "import { generateGen3Layout, sampleGen3Environment } from './gen3.js';\nimport { sampleGen3RegionInfluence } from './gen3Architecture.js';\n")
          one('src/world/generator.ts', "  let spatialProfile: CellDescriptor['spatialProfile'] = environment.regionId === 'pillar-field' ? 'pillar-expanse' : 'standard';\n", "  const centerInfluence = sampleGen3RegionInfluence(seed, worldX, worldZ, worldDay, exposure, tuning);\n  let spatialProfile: CellDescriptor['spatialProfile'] = centerInfluence.deepPillar > 0.72 ? 'pillar-expanse' : 'standard';\n")
          one('src/world/generator.ts', "  const lightingZone = manilaRoom ? 'manila' : zoneId;\n", "  const lightingZone = manilaRoom ? 'manila' : 'baseline';\n")
          p=Path('src/world/generator.ts'); t=p.read_text(); a=t.index('  const stability = manilaRoom',t.index('export function generateGen3Cell')); b=t.index('  return {',a)
          t=t[:a]+"""  const intentionalIrregularity = !manilaRoom
            && environment.fields.abnormality > 0.84
            && environment.fields.stability < 0.3
            && unitFloat(`${seed}:gen3-v4:intentional-irregularity:${x}:${z}`) < 0.12;
          const stability = manilaRoom
            ? ZONE_PROFILES.manila.stability
            : intentionalIrregularity
              ? 'disorienting'
              : centerInfluence.arch > 0.68
                ? 'stable'
                : 'semi-stable';
          """+t[b:]
          t=t.replace("    hallucinationAnchor: !manilaRoom && stability === 'disorienting' && unitFloat(`${seed}:gen3-hallucination:${x}:${z}`) < 0.024\n", "    hallucinationAnchor: !manilaRoom && intentionalIrregularity && unitFloat(`${seed}:gen3-v4:hallucination:${x}:${z}`) < 0.14\n",1)
          p.write_text(t)

          # material UV phase
          one('src/renderer/support.ts', "export function makeMaterial(diffuse: [number, number, number], texture?: pc.Texture, tiling: [number, number] = [1, 1], emissive?: [number, number, number], emissiveIntensity = 1): pc.StandardMaterial {\n", "export function makeMaterial(diffuse: [number, number, number], texture?: pc.Texture, tiling: [number, number] = [1, 1], emissive?: [number, number, number], emissiveIntensity = 1, uvOffset: [number, number] = [0, 0]): pc.StandardMaterial {\n")
          one('src/renderer/support.ts', "  if (texture) { result.diffuseMap = texture; result.diffuseMapTiling = new pc.Vec2(tiling[0], tiling[1]); }\n", "  if (texture) { result.diffuseMap = texture; result.diffuseMapTiling = new pc.Vec2(tiling[0], tiling[1]); result.diffuseMapOffset = new pc.Vec2(uvOffset[0], uvOffset[1]); }\n")
          one('src/renderer/cellBuilder.ts', "export type MaterialFactory = (key: string, diffuse: [number, number, number], textureKind?: TextureKind, variant?: number, tiling?: [number, number], emissive?: [number, number, number], emissiveIntensity?: number) => pc.StandardMaterial;\n", "export type MaterialFactory = (key: string, diffuse: [number, number, number], textureKind?: TextureKind, variant?: number, tiling?: [number, number], emissive?: [number, number, number], emissiveIntensity?: number, uvOffset?: [number, number]) => pc.StandardMaterial;\n")
          p=Path('src/renderer/cellBuilder.ts'); t=p.read_text()
          a=t.index('    const profile = descriptor.world.structureIds.includes'); b=t.index('    const floorMat =',a)
          t=t[:a]+"""    const gen3 = descriptor.world.generationVersion === 'gen3-v1';
          const profile = descriptor.world.structureIds.includes('manila-room')
            ? ZONE_PROFILES.manila
            : legacyExitFoyer
              ? ZONE_PROFILES['exit-threshold']
              : gen3
                ? ZONE_PROFILES.baseline
                : ZONE_PROFILES[descriptor.address.zoneId];
          """+t[b:]
          old="      const wallLength = Math.max(wallSpec.sx, wallSpec.sz);\n      const wallRepeats = gen3 ? Math.max(1, Math.round(wallLength / 2.6)) : Math.max(1, wallLength / 2.6);\n"
          new="""      const wallLength = Math.max(wallSpec.sx, wallSpec.sz);
          const wallRepeats = Math.max(1, wallLength / 2.6);
          const longAxisIsX = wallSpec.orientation === 'z';
          const worldStart = longAxisIsX
            ? descriptor.address.cellX * CELL_SIZE + wallSpec.cx - wallSpec.sx / 2
            : descriptor.address.cellZ * CELL_SIZE + wallSpec.cz - wallSpec.sz / 2;
          const phase = ((worldStart / 2.6) % 1 + 1) % 1;
          """
          if old not in t: raise RuntimeError('wall repeat anchor')
          t=t.replace(old,new,1)
          t=t.replace("          'wall', wallSpec.materialVariant ?? descriptor.variant % 4, [wallRepeats, 1]\n        );", "          'wall', wallSpec.materialVariant ?? descriptor.variant % 4, [wallRepeats, 1], undefined, 1, gen3 ? [phase, 0] : [0, 0]\n        );",1)
          t=t.replace("        this.box(`${wallSpec.id}:skirting`, root, [wallSpec.cx, 0.12, wallSpec.cz], [horizontal ? wallSpec.sx : wallSpec.sx + 0.035, 0.23, horizontal ? wallSpec.sz + 0.035 : wallSpec.sz], trimMat);", "        this.box(`${wallSpec.id}:skirting`, root, [wallSpec.cx, 0.11, wallSpec.cz], [horizontal ? wallSpec.sx : wallSpec.sx + 0.012, 0.22, horizontal ? wallSpec.sz + 0.012 : wallSpec.sz], trimMat);",1)
          t=t.replace("      : descriptor.address.zoneId === 'pillar'\n", "      : descriptor.world.generationVersion === 'gen2' && descriptor.address.zoneId === 'pillar'\n",1)
          t=t.replace("    this.addPropGeometry(root, prop, ZONE_PROFILES[descriptor.address.zoneId]);\n", "    this.addPropGeometry(root, prop, descriptor.world.generationVersion === 'gen3-v1' ? ZONE_PROFILES.baseline : ZONE_PROFILES[descriptor.address.zoneId]);\n",1)
          p.write_text(t)

          # WorldRenderer
          one('src/renderer/WorldRenderer.ts', "  private getMaterial(key: string, diffuse: [number, number, number], textureKind?: TextureKind, variant = 0, tiling: [number, number] = [1, 1], emissive?: [number, number, number], emissiveIntensity = 1): pc.StandardMaterial {\n    const fullKey = `${key}:${variant}:${tiling.join(',')}:${emissiveIntensity}`;\n", "  private getMaterial(key: string, diffuse: [number, number, number], textureKind?: TextureKind, variant = 0, tiling: [number, number] = [1, 1], emissive?: [number, number, number], emissiveIntensity = 1, uvOffset: [number, number] = [0, 0]): pc.StandardMaterial {\n    const fullKey = `${key}:${variant}:${tiling.join(',')}:${emissiveIntensity}:${uvOffset.join(',')}`;\n")
          one('src/renderer/WorldRenderer.ts', "    const created = makeMaterial(diffuse, textureKind ? this.texture(textureKind, variant) : undefined, tiling, emissive, emissiveIntensity);\n", "    const created = makeMaterial(diffuse, textureKind ? this.texture(textureKind, variant) : undefined, tiling, emissive, emissiveIntensity, uvOffset);\n")
          one('src/renderer/WorldRenderer.ts', "    const profile = ZONE_PROFILES[descriptor.address.zoneId];\n    for (const group of descriptor.lightGroups) {\n", "    const profile = descriptor.world.generationVersion === 'gen3-v1' ? ZONE_PROFILES.baseline : ZONE_PROFILES[descriptor.address.zoneId];\n    for (const group of descriptor.lightGroups) {\n")
          one('src/renderer/WorldRenderer.ts', "  spatialFixtureLights(playerX: number, playerZ: number, elapsedSeconds: number, reducedFlicker: boolean, limit = 4): SpatialFixtureLight[] {\n    return selectSpatialFixtureLights(this.lightSources(), playerX, playerZ, elapsedSeconds, reducedFlicker, limit);\n  }\n", "  spatialFixtureLights(playerX: number, playerZ: number, elapsedSeconds: number, reducedFlicker: boolean, limit = 4, previousIds: readonly string[] = []): SpatialFixtureLight[] {\n    return selectSpatialFixtureLights(this.lightSources(), playerX, playerZ, elapsedSeconds, reducedFlicker, limit, previousIds);\n  }\n")

          # light budgets and hysteresis
          one('src/world/lighting.ts', "export const BASELINE_OFF_CHANCE = 0.002;\nexport const BASELINE_FLICKER_CHANCE = 0.018;\n", "export const BASELINE_OFF_CHANCE = 0.0005;\nexport const BASELINE_FLICKER_CHANCE = 0.006;\nconst FIXTURE_LIGHT_ACQUIRE_RADIUS = 21.5;\nconst FIXTURE_LIGHT_RELEASE_RADIUS = 27.5;\n")
          p=Path('src/world/lighting.ts'); t=p.read_text(); a=t.index('export function selectSpatialFixtureLights('); b=t.index('\nexport function validateLightClearance',a)
          t=t[:a]+"""export function selectSpatialFixtureLights(
          sources: readonly LightFieldSource[], playerX: number, playerZ: number, elapsedSeconds: number,
          reducedFlicker: boolean, limit = 4, previousIds: readonly string[] = []
          ): SpatialFixtureLight[] {
          const candidates = new Map<string, SpatialFixtureLight>();
          for (const source of sources) {
            if (source.group.state === 'off') continue;
            const pulse = lightFlickerValue(source.group, elapsedSeconds, reducedFlicker);
            for (let index = 0; index < source.group.fixtures.length; index += 1) {
              const fixture = source.group.fixtures[index]!;
              const worldX = source.cellX * CELL_SIZE + fixture.x;
              const worldZ = source.cellZ * CELL_SIZE + fixture.z;
              const distance = Math.hypot(worldX - playerX, worldZ - playerZ);
              if (distance > FIXTURE_LIGHT_RELEASE_RADIUS) continue;
              const id = `${source.group.id}:${index}`;
              candidates.set(id, { id, worldX, worldY: fixture.y - 0.18, worldZ, distance, intensity: source.group.intensity * pulse * 0.82, temperature: source.group.temperature });
            }
          }
          const selected: SpatialFixtureLight[] = [];
          const selectedIds = new Set<string>();
          for (const id of previousIds) {
            const candidate = candidates.get(id);
            if (!candidate || selected.length >= Math.max(0, limit)) continue;
            selected.push(candidate); selectedIds.add(id);
          }
          const available = [...candidates.values()].filter((c) => c.distance <= FIXTURE_LIGHT_ACQUIRE_RADIUS && !selectedIds.has(c.id)).sort((l,r) => l.distance-r.distance || l.id.localeCompare(r.id));
          for (const candidate of available) {
            if (selected.length >= Math.max(0, limit)) break;
            selected.push(candidate); selectedIds.add(candidate.id);
          }
          return selected;
          }
          """+t[b:]
          p.write_text(t)

          # runtime slot persistence
          one('src/app/ProjectNoclipGame.ts', "  private fixtureLights: pc.Entity[] = [];\n", "  private fixtureLights: pc.Entity[] = [];\n  private fixtureLightSourceIds: string[] = [];\n")
          one('src/app/ProjectNoclipGame.ts', "    this.lightField = { ...EMPTY_LIGHT_FIELD }; this.journeyElapsed = 0; this.lightFieldAccumulator = 0; this.regionExtent = undefined; this.regionExtentKey = '';\n", "    this.lightField = { ...EMPTY_LIGHT_FIELD }; this.journeyElapsed = 0; this.lightFieldAccumulator = 0; this.regionExtent = undefined; this.regionExtentKey = ''; this.fixtureLightSourceIds = [];\n")
          one('src/app/ProjectNoclipGame.ts', "    const spatial = this.renderer.spatialFixtureLights(position.x, position.z, this.journeyElapsed, this.save.settings.reducedFlicker, this.fixtureLights.length);\n", "    const spatial = this.renderer.spatialFixtureLights(position.x, position.z, this.journeyElapsed, this.save.settings.reducedFlicker, this.fixtureLights.length, this.fixtureLightSourceIds);\n    this.fixtureLightSourceIds = spatial.map((source) => source.id);\n")

          for f in ['.github/workflows/dev4-apply-core.yml','.github/workflows/dev4-apply-core2.yml','.github/workflows/dev4-apply-core3.yml']:
            q=Path(f)
            if q.exists(): q.unlink()
          PY
          npm install --no-audit --no-fund
          npm run typecheck
          git config user.name "xash-mind"
          git config user.email "sashreeksagar5@gmail.com"
          git add src .github/workflows
          git commit -m "feat: rebuild Gen3 around world coherence"
          git push origin HEAD:agent/dev4-world-coherence
