name: Project Noclip Core Correctness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      NOCLIP_BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NOCLIP_PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Record exact verification identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$NOCLIP_BRANCH_HEAD_SHA"
          echo "BRANCH_HEAD_SHA=$actual"
          echo "PR_MERGE_SHA=${NOCLIP_PR_MERGE_SHA:-none}"
          echo "VERSION=$(tr -d '[:space:]' < VERSION)"
          mkdir -p artifacts/core-correctness
          printf 'BRANCH_HEAD_SHA=%s\nPR_MERGE_SHA=%s\nVERSION=%s\n' \
            "$actual" "${NOCLIP_PR_MERGE_SHA:-none}" "$(tr -d '[:space:]' < VERSION)" \
            > artifacts/core-correctness/verification-context.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Verify verification architecture contract
        run: python scripts/verification-contract-tests.py
      - name: Presentation definitions / NAL build
        run: npm run presentation:build
      - name: Noclip Studio static check
        run: npm run studio:check
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Full deterministic and system tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee artifacts/core-correctness/test.log
      - name: 10,000-Cell benchmark
        shell: bash
        run: npm run benchmark | tee artifacts/core-correctness/benchmark.log
      - name: Production build + Studio production security boundary
        run: npm run build
      - name: Upload core correctness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-correctness-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/core-correctness
          if-no-files-found: warn
          retention-days: 14
