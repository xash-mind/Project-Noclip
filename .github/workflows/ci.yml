name: Project Noclip CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - name: Install browser-smoke driver
        run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Run character creator, mobile, desktop, CV-H1 floor and world-cohesion Chromium journeys
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > /tmp/project-noclip-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/project-noclip-preview.log || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Preview server did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          NOCLIP_VERSION_ARTIFACTS="artifacts/browser-smoke" python scripts/version-smoke.py
          NOCLIP_CHARACTER_ARTIFACTS="artifacts/character-creator-smoke" python scripts/character-creator-smoke.py
          NOCLIP_MOBILE_ARTIFACTS="artifacts/mobile-smoke" python scripts/run-legacy-smoke-with-character-creator.py scripts/mobile-smoke.py
          python scripts/run-legacy-smoke-with-character-creator.py scripts/browser-smoke.py
          NOCLIP_CVH1_ARTIFACTS="artifacts/cvh1-floor-smoke" python scripts/run-legacy-smoke-with-character-creator.py scripts/cvh1-floor-smoke.py
          candidate_version="v$(tr -d '[:space:]' < VERSION)"
          NOCLIP_BASE_URL="http://127.0.0.1:4173" \
          NOCLIP_DEPLOYMENT_COMMIT="$GITHUB_SHA" \
          NOCLIP_DEPLOYMENT_ID="local-ci-cvh1" \
          NOCLIP_EXPECTED_VERSION="$candidate_version" \
          NOCLIP_PROFILE_STATIC_SECONDS="1.5" \
          NOCLIP_PROFILE_ARTIFACTS="artifacts/cvh1-renderer-profile" \
          python scripts/run-legacy-smoke-with-character-creator.py scripts/profile-candidate-renderer.py
          python scripts/run-legacy-smoke-with-character-creator.py scripts/world-cohesion-smoke.py
      - name: Upload browser-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-mobile-cvh1-cohesion-smoke-${{ github.sha }}
          path: |
            artifacts/browser-smoke
            artifacts/character-creator-smoke
            artifacts/mobile-smoke
            artifacts/cvh1-floor-smoke
            artifacts/cvh1-renderer-profile
            artifacts/world-cohesion-smoke
          if-no-files-found: warn
          retention-days: 14
