name: Dev.8 Production Traversal Spike Baseline
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-spike-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Measure canonical production Dev.8 traversal spikes
        env:
          NOCLIP_BASE_URL: https://project-noclip.vercel.app
          NOCLIP_DEV8_BEFORE_ARTIFACTS: artifacts/dev8-production-before
        run: |
          mkdir -p artifacts/dev8-production-before
          python scripts/dev8-production-spike-profile.py | tee artifacts/dev8-production-before/workflow-report.log
      - name: Upload production traversal baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev8-production-traversal-before-${{ github.sha }}
          path: artifacts/dev8-production-before
          if-no-files-found: warn
          retention-days: 30
