name: Temporary Arch Streaming Runtime Profile

on:
  push:
    branches:
      - cleanup/codebase-maintainability-2026-08-14

permissions:
  contents: write

jobs:
  profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact before and after worktrees
        run: |
          git worktree add /tmp/noclip-before 2a183c9cdcd9ad4089e0f4261e276ae82a8efc23
          git worktree add /tmp/noclip-after 77f1aaea57b0c9d42b556d64482e98f43a563574
          cp scripts/_tmp_arch_streaming_runtime_profile.py /tmp/runtime-profile.py
          python - <<'PY'
          from pathlib import Path
          for root in (Path('/tmp/noclip-before'), Path('/tmp/noclip-after')):
              main=root/'src/main.ts'
              text=main.read_text()
              needle='const game = new ProjectNoclipGame();\n'
              assert needle in text
              text=text.replace(needle, needle+"(window as unknown as { __testGame?: ProjectNoclipGame }).__testGame = game;\n",1)
              main.write_text(text)
              batching=root/'src/renderer/StaticWorldBatching.ts'
              source=batching.read_text()
              source=source.replace('const reconcile = (): void => {','const reconcileStaticWorldBatches = (): void => {')
              source=source.replace('  reconcile();\n  window.setInterval(reconcile, RECONCILE_INTERVAL_MS);','  reconcileStaticWorldBatches();\n  window.setInterval(reconcileStaticWorldBatches, RECONCILE_INTERVAL_MS);')
              source=source.replace('  reconcile();\n  window.setInterval(reconcile, 100);','  reconcileStaticWorldBatches();\n  window.setInterval(reconcileStaticWorldBatches, 100);')
              batching.write_text(source)
          PY
      - name: Build both exact source revisions
        run: |
          (cd /tmp/noclip-before && npm install --no-audit --no-fund && npm run build)
          (cd /tmp/noclip-after && npm install --no-audit --no-fund && npm run build)
      - name: Start local preview servers
        run: |
          (cd /tmp/noclip-before && PORT=4173 npm run preview > /tmp/before-preview.log 2>&1 & echo $! > /tmp/before.pid)
          (cd /tmp/noclip-after && PORT=4174 npm run preview > /tmp/after-preview.log 2>&1 & echo $! > /tmp/after.pid)
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && curl -fsS http://127.0.0.1:4174 >/dev/null && exit 0; sleep 1; done
          cat /tmp/before-preview.log /tmp/after-preview.log
          exit 1
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Profile 10 straight and 10 diagonal boundary crossings
        run: python /tmp/runtime-profile.py
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-streaming-runtime-profile
          path: artifacts/arch-streaming-runtime
          if-no-files-found: warn
      - name: Remove temporary profiling harness
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/_tmp-arch-streaming-runtime.yml scripts/_tmp_arch_streaming_runtime_profile.py
          git commit -m "chore: remove bounded runtime profiling harness"
          git push origin HEAD:cleanup/codebase-maintainability-2026-08-14
