name: Project Noclip Production Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public deployment URL to verify
        required: false
        default: https://project-noclip.vercel.app
      deployment_commit:
        description: Git commit expected on the deployment
        required: false
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - package-lock.json
      - VERSION
      - vite.config.ts
      - index.html
      - vercel.json
      - scripts/build.mjs
      - scripts/preview.mjs
      - scripts/browser-smoke.py
      - scripts/mobile-smoke.py
      - scripts/version-smoke.py
      - .github/workflows/production-smoke.yml

permissions:
  contents: read

concurrency:
  group: project-noclip-production-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve production target
        shell: bash
        env:
          REQUESTED_BASE_URL: ${{ github.event.inputs.base_url }}
          REQUESTED_DEPLOYMENT_COMMIT: ${{ github.event.inputs.deployment_commit }}
        run: |
          set -euo pipefail
          echo "NOCLIP_TARGET_URL=${REQUESTED_BASE_URL:-https://project-noclip.vercel.app}" >> "$GITHUB_ENV"
          echo "NOCLIP_DEPLOYMENT_COMMIT=${REQUESTED_DEPLOYMENT_COMMIT:-$GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Install browser-smoke driver
        run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Wait for canonical deployed version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-browser-smoke artifacts/production-mobile-smoke
          NOCLIP_BASE_URL="${NOCLIP_TARGET_URL}" \
          NOCLIP_VERSION_WAIT_SECONDS="420" \
          NOCLIP_VERSION_ARTIFACTS="artifacts/production-browser-smoke" \
          python scripts/version-smoke.py
      - name: Capture public asset manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base_url = os.environ["NOCLIP_TARGET_URL"].rstrip("/") + "/"
          request = urllib.request.Request(base_url, headers={"User-Agent": "Project-Noclip-Production-Smoke/1.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read()
              status = response.status
              final_url = response.geturl()

          text = html.decode("utf-8")
          paths = sorted(set(re.findall(r'(?:src|href)=["\']([^"\']*assets/[^"\']+)["\']', text)))
          assets = []
          for path in paths:
              url = urllib.parse.urljoin(base_url, path)
              asset_request = urllib.request.Request(url, headers={"User-Agent": "Project-Noclip-Production-Smoke/1.0"})
              with urllib.request.urlopen(asset_request, timeout=60) as response:
                  body = response.read()
              assets.append({
                  "path": path,
                  "url": url,
                  "bytes": len(body),
                  "sha256": hashlib.sha256(body).hexdigest(),
              })

          if not assets:
              raise RuntimeError("Production HTML did not expose generated asset paths")

          manifest = {
              "requestedUrl": base_url,
              "finalUrl": final_url,
              "status": status,
              "htmlBytes": len(html),
              "htmlSha256": hashlib.sha256(html).hexdigest(),
              "assets": assets,
              "expectedDeploymentCommit": os.environ["NOCLIP_DEPLOYMENT_COMMIT"],
          }
          output = Path("artifacts/production-browser-smoke/asset-manifest.json")
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Run desktop Chromium journey against production
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying ${NOCLIP_TARGET_URL} at visible $(cat VERSION)"
          NOCLIP_BASE_URL="${NOCLIP_TARGET_URL}" \
          NOCLIP_BROWSER_ARTIFACTS="artifacts/production-browser-smoke" \
          python scripts/browser-smoke.py
      - name: Run landscape touch journey against production
        shell: bash
        run: |
          set -euo pipefail
          NOCLIP_BASE_URL="${NOCLIP_TARGET_URL}" \
          NOCLIP_MOBILE_ARTIFACTS="artifacts/production-mobile-smoke" \
          python scripts/mobile-smoke.py
      - name: Upload production-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-mobile-smoke-${{ github.sha }}
          path: |
            artifacts/production-browser-smoke
            artifacts/production-mobile-smoke
          if-no-files-found: warn
          retention-days: 30
