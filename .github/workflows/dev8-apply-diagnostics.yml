name: Apply bounded Dev.8 diagnostics
on:
  push:
    branches: [dev8-traversal-aa1-ownership]
    paths:
      - dev/dev8-diagnostics-transform.sh
      - dev/dev8-diagnostics-typefix.sh
      - .github/workflows/dev8-apply-diagnostics.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev8-traversal-aa1-ownership
          fetch-depth: 0
      - name: Apply exact bounded diagnostics transform
        run: |
          bash dev/dev8-diagnostics-transform.sh
          bash dev/dev8-diagnostics-typefix.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified diagnostics and clean staging machinery
        run: |
          set -euo pipefail
          git rm dev/dev8-diagnostics-transform.sh dev/dev8-diagnostics-typefix.sh .github/workflows/dev8-apply-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/renderer/fixtureLighting.ts src/renderer/StaticWorldBatching.ts src/renderer/level0RegionPresentation.ts src/renderer/rendererRuntimeDiagnostics.ts tests/dev8-runtime-diagnostics.test.mjs
          git commit -m "Add Dev.8 renderer failure and spike diagnostics"
          git fetch origin dev8-traversal-aa1-ownership
          git rebase origin/dev8-traversal-aa1-ownership
          git push origin HEAD:dev8-traversal-aa1-ownership
