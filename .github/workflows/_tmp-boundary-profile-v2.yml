name: Temporary Boundary Profile V2

on:
  push:
    branches:
      - cleanup/codebase-maintainability-2026-08-14

permissions:
  contents: write

jobs:
  profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact before/after worktrees
        run: |
          git worktree add /tmp/noclip-before 2a183c9cdcd9ad4089e0f4261e276ae82a8efc23
          git worktree add /tmp/noclip-after 04d89e8a4b772efdcd817ceb19cf748b1198c760
          cp scripts/_tmp_boundary_profile_v2.py /tmp/boundary-profile-v2.py
          python - <<'PY'
          from pathlib import Path
          for root in (Path('/tmp/noclip-before'),Path('/tmp/noclip-after')):
              p=root/'src/main.ts';t=p.read_text();needle='const game = new ProjectNoclipGame();\n';assert needle in t;p.write_text(t.replace(needle,needle+"(window as unknown as { __testGame?: ProjectNoclipGame }).__testGame = game;\n",1))
              b=root/'src/renderer/StaticWorldBatching.ts';s=b.read_text();s=s.replace('const reconcile = (): void => {','const reconcileStaticWorldBatches = (): void => {').replace('  reconcile();\n  window.setInterval(reconcile, RECONCILE_INTERVAL_MS);','  reconcileStaticWorldBatches();\n  window.setInterval(reconcileStaticWorldBatches, RECONCILE_INTERVAL_MS);').replace('  reconcile();\n  window.setInterval(reconcile, 100);','  reconcileStaticWorldBatches();\n  window.setInterval(reconcileStaticWorldBatches, 100);');b.write_text(s)
          PY
      - name: Build exact revisions
        run: |
          (cd /tmp/noclip-before && npm install --no-audit --no-fund && npm run build)
          (cd /tmp/noclip-after && npm install --no-audit --no-fund && npm run build)
      - name: Serve exact revisions
        run: |
          (cd /tmp/noclip-before && PORT=4173 npm run preview >/tmp/before.log 2>&1 &)
          (cd /tmp/noclip-after && PORT=4174 npm run preview >/tmp/after.log 2>&1 &)
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && curl -fsS http://127.0.0.1:4174 >/dev/null && exit 0; sleep 1; done
          cat /tmp/before.log /tmp/after.log; exit 1
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Profile boundary transitions
        run: python /tmp/boundary-profile-v2.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-profile-v2
          path: artifacts/boundary-profile-v2
          if-no-files-found: warn
      - name: Remove temporary harness
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/_tmp-boundary-profile-v2.yml scripts/_tmp_boundary_profile_v2.py
          git commit -m "chore: remove boundary profiling harness"
          git push origin HEAD:cleanup/codebase-maintainability-2026-08-14
