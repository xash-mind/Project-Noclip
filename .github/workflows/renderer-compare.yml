name: Project Noclip Renderer Regression

on:
  pull_request:
    branches: [main]
    paths:
      - src/renderer/**
      - src/world/**
      - src/audio/**
      - src/ui/**
      - src/version.ts
      - src/main.ts
      - VERSION
      - vite.config.ts
      - vercel.json
      - .github/workflows/renderer-compare.yml
      - scripts/profile-production.py
      - STATUS.md

permissions:
  contents: read

concurrency:
  group: project-noclip-renderer-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Profile accepted production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/renderer-compare/before artifacts/renderer-compare/after
          readarray -t baseline < <(python - <<'PY'
          import re
          from pathlib import Path

          status = Path('STATUS.md').read_text(encoding='utf-8')
          commit = re.search(r'^\*\*Production release commit:\*\* `([^`]+)`', status, re.MULTILINE)
          version = re.search(r'^\*\*Visible deployed version:\*\* `([^`]+)`', status, re.MULTILINE)
          if not commit or not version:
              raise RuntimeError('STATUS.md does not expose the accepted production commit/version contract')
          print(commit.group(1))
          print(version.group(1))
          PY
          )
          test -n "${baseline[0]:-}"
          test -n "${baseline[1]:-}"
          echo "Resolved accepted production baseline: ${baseline[0]} / ${baseline[1]}"
          NOCLIP_BASE_URL="https://project-noclip.vercel.app" \
          NOCLIP_DEPLOYMENT_COMMIT="${baseline[0]}" \
          NOCLIP_DEPLOYMENT_ID="canonical-production-${baseline[1]}" \
          NOCLIP_EXPECTED_VERSION="${baseline[1]}" \
          NOCLIP_PROFILE_ARTIFACTS="artifacts/renderer-compare/before" \
          python scripts/profile-production.py
      - name: Build and serve candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          PORT=4173 npm run preview > /tmp/noclip-preview.log 2>&1 &
          echo $! > /tmp/noclip-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/noclip-preview.log
          exit 1
      - name: Profile candidate on same runner
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          candidate_version="v$(tr -d '[:space:]' < VERSION)"
          NOCLIP_BASE_URL="http://127.0.0.1:4173" \
          NOCLIP_DEPLOYMENT_COMMIT="$CANDIDATE_COMMIT" \
          NOCLIP_DEPLOYMENT_ID="local-candidate" \
          NOCLIP_EXPECTED_VERSION="$candidate_version" \
          NOCLIP_PROFILE_ARTIFACTS="artifacts/renderer-compare/after" \
          python scripts/profile-production.py
      - name: Compare renderer budgets and Generation 3 invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/renderer-compare')
          before = json.loads((root / 'before' / 'profile.json').read_text(encoding='utf-8'))
          after = json.loads((root / 'after' / 'profile.json').read_text(encoding='utf-8'))
          scenarios = {
              'defaultSpawn': {'drawCalls': 220, 'colliders': 1200, 'interactions': 160},
              'holeCarverRadius1': {'drawCalls': 160, 'colliders': 600, 'interactions': 120},
              'worldLabShowcase': {'drawCalls': 280, 'colliders': 1400, 'interactions': 260},
          }
          comparison = {'scenarios': {}, 'catalogCount': after['catalogCount']}
          for key, caps in scenarios.items():
              before_metrics = before['scenarios'][key]['worldMetricsAfter']
              after_metrics = after['scenarios'][key]['worldMetricsAfter']
              assert after_metrics['loadedCells'] == before_metrics['loadedCells'], (
                  f"{key} streaming cardinality changed: {before_metrics['loadedCells']} -> {after_metrics['loadedCells']}"
              )
              assert after_metrics.get('generation') == 'gen3-v1', f"{key} did not profile Generation 3"
              for metric in ('drawCalls', 'colliders', 'interactions'):
                  value = int(after_metrics[metric])
                  assert value <= caps[metric], f"{key} {metric} {value} exceeds absolute cap {caps[metric]}"
              before_draw = int(before_metrics['drawCalls'])
              after_draw = int(after_metrics['drawCalls'])
              # Generation 3 intentionally replaces semantically different
              # Generation 2 scenes. Keep the production delta as evidence,
              # while judging the candidate against explicit scene budgets.
              comparison['scenarios'][key] = {
                  'production': {name: before_metrics.get(name) for name in ('drawCalls', 'loadedCells', 'colliders', 'interactions')},
                  'candidate': {name: after_metrics.get(name) for name in ('drawCalls', 'loadedCells', 'colliders', 'interactions')},
                  'drawDeltaPct': round((after_draw - before_draw) * 100 / max(1, before_draw), 2),
                  'caps': caps,
              }
          hole_metrics = after['scenarios']['holeCarverRadius1']['worldMetricsAfter']
          assert 'floor-hole-cluster' in str(hole_metrics.get('carvers', ''))
          comparison['saveReload'] = after['saveReload']
          comparison['browserErrors'] = after.get('browserErrors', [])
          assert after['catalogCount'] > 0
          assert after['saveReload']['version'] == 2
          assert after['saveReload']['generationVersion'] == 'gen3-v1'
          assert not comparison['browserErrors']
          (root / 'comparison.json').write_text(json.dumps(comparison, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(comparison, indent=2))
          PY
      - name: Upload renderer comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-compare-${{ github.event.pull_request.head.sha }}
          path: artifacts/renderer-compare
          if-no-files-found: warn
          retention-days: 30
      - name: Stop local preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/noclip-preview.pid ]; then kill "$(cat /tmp/noclip-preview.pid)" 2>/dev/null || true; fi
