name: Project Noclip Renderer Regression

on:
  pull_request:
    branches: [main]
    paths:
      - src/renderer/**
      - src/world/**
      - src/audio/**
      - src/ui/**
      - src/version.ts
      - src/main.ts
      - VERSION
      - vite.config.ts
      - vercel.json
      - .github/workflows/renderer-compare.yml
      - scripts/profile-production.py
      - scripts/profile-candidate-renderer.py
      - STATUS.md

permissions:
  contents: read

concurrency:
  group: project-noclip-renderer-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Profile canonical production baseline when it matches main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/renderer-compare/before artifacts/renderer-compare/after
          git fetch origin main --depth=1
          baseline_commit="$(git rev-parse origin/main)"
          baseline_version="v$(git show origin/main:VERSION | tr -d '[:space:]')"
          test -n "$baseline_commit"
          test -n "$baseline_version"
          deployed_version="$(python - <<'PY'
          import shutil
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--window-size=1280,720')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--no-sandbox')
          chrome_binary = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if chrome_binary:
              options.binary_location = chrome_binary
          driver = webdriver.Chrome(options=options)
          try:
              driver.get('https://project-noclip.vercel.app')
              element = WebDriverWait(driver, 20).until(
                  lambda current: current.find_element(By.CSS_SELECTOR, '[data-ui="version-indicator"]')
              )
              print((element.get_attribute('textContent') or '').strip())
          finally:
              driver.quit()
          PY
          )"
          test -n "$deployed_version"
          if [ "$deployed_version" != "$baseline_version" ]; then
            printf '%s\n' "production comparison unavailable: canonical production ${deployed_version}; main ${baseline_version}" \
              > artifacts/renderer-compare/before/status.txt
            echo "Canonical production is ${deployed_version} while main is ${baseline_version}; continuing with absolute candidate budgets during the release gap."
            exit 0
          fi
          echo "Resolved matching canonical production baseline: ${baseline_commit} / ${baseline_version}"
          if ! NOCLIP_BASE_URL="https://project-noclip.vercel.app" \
            NOCLIP_DEPLOYMENT_COMMIT="$baseline_commit" \
            NOCLIP_DEPLOYMENT_ID="canonical-production-${baseline_version}" \
            NOCLIP_EXPECTED_VERSION="$baseline_version" \
            NOCLIP_PROFILE_ARTIFACTS="artifacts/renderer-compare/before" \
            python scripts/profile-production.py; then
            rm -f artifacts/renderer-compare/before/profile.json
            printf '%s\n' \
              "production comparison unavailable: canonical Dev.8 profile stalled/failed; see Dev.8 production traversal baseline for bounded failure evidence" \
              > artifacts/renderer-compare/before/status.txt
            echo "Canonical production profile failed under the known Dev.8 runtime fault; continuing with absolute candidate renderer budgets."
          fi
      - name: Build and serve candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          PORT=4173 npm run preview > /tmp/noclip-preview.log 2>&1 &
          echo $! > /tmp/noclip-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/noclip-preview.log
          exit 1
      - name: Profile candidate on same runner
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          candidate_version="v$(tr -d '[:space:]' < VERSION)"
          NOCLIP_BASE_URL="http://127.0.0.1:4173" \
          NOCLIP_DEPLOYMENT_COMMIT="$CANDIDATE_COMMIT" \
          NOCLIP_DEPLOYMENT_ID="local-candidate" \
          NOCLIP_EXPECTED_VERSION="$candidate_version" \
          NOCLIP_PROFILE_ARTIFACTS="artifacts/renderer-compare/after" \
          python scripts/profile-candidate-renderer.py
      - name: Compare renderer budgets and Generation 3 invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/renderer-compare')
          before_path = root / 'before' / 'profile.json'
          before = json.loads(before_path.read_text(encoding='utf-8')) if before_path.exists() else None
          after = json.loads((root / 'after' / 'profile.json').read_text(encoding='utf-8'))

          # Dev.8 deliberately retains the post-PAU one-to-one fixture shadow
          # architecture. Absolute budgets and deterministic streaming cardinality
          # therefore remain authoritative even when canonical production itself
          # cannot complete the broad production profiler under the known runtime fault.
          scenarios = {
              'defaultSpawn': {'loadedCells': 49, 'drawCalls': 220, 'colliders': 1200, 'interactions': 160},
              'holeCarverRadius1': {'loadedCells': 9, 'drawCalls': 220, 'colliders': 600, 'interactions': 120},
              'worldLabShowcase': {'loadedCells': 49, 'drawCalls': 280, 'colliders': 1400, 'interactions': 260},
          }
          comparison = {
              'productionComparisonAvailable': before is not None,
              'scenarios': {},
              'catalogCount': after['catalogCount'],
          }
          for key, caps in scenarios.items():
              after_metrics = after['scenarios'][key]['worldMetricsAfter']
              assert int(after_metrics['loadedCells']) == caps['loadedCells'], (
                  f"{key} active streaming cardinality {after_metrics['loadedCells']} != {caps['loadedCells']}"
              )
              assert after_metrics.get('generation') == 'gen3-v1', f"{key} did not profile Generation 3"
              for metric in ('drawCalls', 'colliders', 'interactions'):
                  value = int(after_metrics[metric])
                  assert value <= caps[metric], f"{key} {metric} {value} exceeds absolute cap {caps[metric]}"
              active_omnis = int(after_metrics.get('activeOmnis') or 0)
              shadowed_omnis = int(after_metrics.get('shadowedOmnis') or 0)
              assert active_omnis == shadowed_omnis, (
                  f"{key} violated the fixture light/shadow invariant: {active_omnis} active vs {shadowed_omnis} shadowed"
              )
              production = None
              draw_delta = None
              if before is not None:
                  before_metrics = before['scenarios'][key]['worldMetricsAfter']
                  assert after_metrics['loadedCells'] == before_metrics['loadedCells'], (
                      f"{key} active streaming cardinality changed: {before_metrics['loadedCells']} -> {after_metrics['loadedCells']}"
                  )
                  before_draw = int(before_metrics['drawCalls'])
                  after_draw = int(after_metrics['drawCalls'])
                  production = {name: before_metrics.get(name) for name in ('drawCalls', 'loadedCells', 'colliders', 'interactions')}
                  draw_delta = round((after_draw - before_draw) * 100 / max(1, before_draw), 2)
              comparison['scenarios'][key] = {
                  'production': production,
                  'candidate': {name: after_metrics.get(name) for name in ('drawCalls', 'loadedCells', 'retainedCells', 'colliders', 'interactions', 'activeOmnis', 'shadowedOmnis')},
                  'drawDeltaPct': draw_delta,
                  'caps': caps,
              }
          hole_metrics = after['scenarios']['holeCarverRadius1']['worldMetricsAfter']
          assert 'floor-hole-cluster' in str(hole_metrics.get('carvers', ''))
          comparison['saveReload'] = after['saveReload']
          comparison['browserErrors'] = after.get('browserErrors', [])
          assert after['catalogCount'] > 0
          assert after['saveReload']['version'] == 2
          assert after['saveReload']['generationVersion'] == 'gen3-v1'
          assert not comparison['browserErrors']
          (root / 'comparison.json').write_text(json.dumps(comparison, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(comparison, indent=2))
          PY
      - name: Upload renderer comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-compare-${{ github.event.pull_request.head.sha }}
          path: artifacts/renderer-compare
          if-no-files-found: warn
          retention-days: 30
      - name: Stop local preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/noclip-preview.pid ]; then kill "$(cat /tmp/noclip-preview.pid)" 2>/dev/null || true; fi