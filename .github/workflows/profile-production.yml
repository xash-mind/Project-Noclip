name: Project Noclip Production Profile

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public deployment URL to profile
        required: false
        default: https://project-noclip.vercel.app
      deployment_commit:
        description: Git commit served by the deployment
        required: false
        default: c2d3cb38faacfc7e8e22dae67aa2e8e8af9ddfea
      deployment_id:
        description: Vercel deployment identifier
        required: false
        default: dpl_C1FfCuvYVQ7aKaVG6bpUPT2o6Gmp
  pull_request:
    branches: [main]
    paths:
      - scripts/profile-production.py
      - scripts/benchmark.mjs
      - .github/workflows/profile-production.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: project-noclip-production-profile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve accepted production target
        shell: bash
        env:
          REQUESTED_BASE_URL: ${{ github.event.inputs.base_url }}
          REQUESTED_DEPLOYMENT_COMMIT: ${{ github.event.inputs.deployment_commit }}
          REQUESTED_DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
        run: |
          set -euo pipefail
          echo "NOCLIP_TARGET_URL=${REQUESTED_BASE_URL:-https://project-noclip.vercel.app}" >> "$GITHUB_ENV"
          echo "NOCLIP_DEPLOYMENT_COMMIT=${REQUESTED_DEPLOYMENT_COMMIT:-c2d3cb38faacfc7e8e22dae67aa2e8e8af9ddfea}" >> "$GITHUB_ENV"
          echo "NOCLIP_DEPLOYMENT_ID=${REQUESTED_DEPLOYMENT_ID:-dpl_C1FfCuvYVQ7aKaVG6bpUPT2o6Gmp}" >> "$GITHUB_ENV"
      - name: Run 10,000-cell deterministic benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-profile
          node scripts/benchmark.mjs > artifacts/production-profile/benchmark.json
          cat artifacts/production-profile/benchmark.json
      - name: Install Chromium profiling driver
        run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Profile accepted production runtime
        shell: bash
        run: |
          set -euo pipefail
          NOCLIP_BASE_URL="$NOCLIP_TARGET_URL" \
          NOCLIP_DEPLOYMENT_COMMIT="$NOCLIP_DEPLOYMENT_COMMIT" \
          NOCLIP_DEPLOYMENT_ID="$NOCLIP_DEPLOYMENT_ID" \
          NOCLIP_PROFILE_ARTIFACTS="artifacts/production-profile" \
          python scripts/profile-production.py
      - name: Publish machine-readable profile summary to Issue 14
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/production-profile")
          profile = json.loads((root / "profile.json").read_text(encoding="utf-8"))
          benchmark = json.loads((root / "benchmark.json").read_text(encoding="utf-8"))
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          lines = [
              "## Issue #14 production profile: passed",
              "",
              f"- Public URL: `{profile['baseUrl']}`",
              f"- Accepted deployment commit: `{profile['deployment']['commit']}`",
              f"- Vercel deployment: `{profile['deployment']['id']}`",
              f"- Profiling workflow commit: `{os.environ['GITHUB_SHA']}`",
              f"- Actions evidence: {run_url}",
              f"- Browser: `{profile['environment']['browser'].get('browserVersion', 'unknown')}`",
              f"- WebGL renderer: `{profile['environment']['webgl'].get('renderer', 'unknown')}`",
              "",
              "### Fixed scenarios",
          ]
          scenario_labels = {
              "baselineSpawn": "Baseline spawn · radius 3",
              "holeSectionRadius1": "Forced Hole Section · radius 1",
              "worldLabShowcase23": "World Lab · 23-object showcase",
              "boundedTraversal": "Bounded streaming traversal",
          }
          for key, label in scenario_labels.items():
              scenario = profile["scenarios"][key]
              frames = scenario["frames"]["frameTimeMs"]
              fps = scenario["frames"]["instantaneousFps"]
              cpu = scenario.get("cpu", {})
              metrics = scenario.get("worldMetricsAfter") or scenario.get("endWorldMetrics") or {}
              lines.append(
                  f"- **{label}:** frame p50 `{frames['median']:.3f} ms`, p95 `{frames['p95']:.3f} ms`, "
                  f"median FPS `{fps['median']:.2f}`, main-thread busy `{cpu.get('mainThreadBusyPct', 'n/a')}%`, "
                  f"draw calls `{metrics.get('drawCalls', 'n/a')}`, loaded cells `{metrics.get('loadedCells', 'n/a')}`"
              )
          traversal = profile["scenarios"]["boundedTraversal"]
          lines.extend([
              "",
              "### Streaming and generator evidence",
              f"- Trusted traversal persisted `{traversal['persistedDistanceMeters']:.2f} m` and recorded `{traversal['unloadCountDelta']}` unload events across `{traversal['uniqueUnloadedCellsDelta']}` unique cells.",
              f"- 10,000-cell benchmark: `{benchmark['elapsedMs']:.2f} ms` total / `{benchmark['microsecondsPerCell']:.2f} µs/cell` / `{benchmark['cellsPerSecond']:.2f} cells/s`.",
              f"- Connector errors: `{benchmark['connectorErrors']}`; placement errors: `{benchmark['placementErrors']}`; benchmark heap: `{benchmark['heapMb']:.2f} MB`.",
              f"- Save/reload: schema v{profile['saveReload']['version']} preserved, position delta `{profile['saveReload']['positionDeltaMeters']:.4f} m`.",
              f"- Browser console errors: `{len(profile.get('browserErrors', []))}`.",
              "",
              "The uploaded artifact contains `profile.json`, `benchmark.json`, and scenario screenshots. The bottleneck conclusion and one bounded optimization recommendation will be posted after these measurements are reviewed; this profiling PR does not modify the deployed game runtime.",
          ])
          for warning in profile.get("warnings", []):
              lines.append(f"- Non-blocking evidence warning: {warning}")
          Path("/tmp/issue-14-profile.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          gh issue comment 14 --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-14-profile.md
      - name: Upload production profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-profile-${{ github.sha }}
          path: artifacts/production-profile
          if-no-files-found: warn
          retention-days: 30
