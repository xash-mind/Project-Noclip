name: Project Noclip Production Profile

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public deployment URL to profile
        required: false
        default: https://project-noclip.vercel.app
      deployment_commit:
        description: Optional explicit Git commit served by the deployment; defaults to accepted STATUS.md
        required: false
      deployment_id:
        description: Optional provider deployment identifier; defaults to a canonical production label
        required: false
      expected_version:
        description: Optional visible version expected on the deployment; defaults to accepted STATUS.md
        required: false
  pull_request:
    branches: [main]
    paths:
      - scripts/profile-production.py
      - scripts/benchmark.mjs
      - .github/workflows/profile-production.yml
      - STATUS.md

permissions:
  contents: read
  issues: write

concurrency:
  group: project-noclip-production-profile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve accepted production target
        shell: bash
        env:
          REQUESTED_BASE_URL: ${{ github.event.inputs.base_url }}
          REQUESTED_DEPLOYMENT_COMMIT: ${{ github.event.inputs.deployment_commit }}
          REQUESTED_DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
          REQUESTED_EXPECTED_VERSION: ${{ github.event.inputs.expected_version }}
        run: |
          set -euo pipefail
          readarray -t accepted < <(python - <<'PY'
          import re
          from pathlib import Path

          status = Path('STATUS.md').read_text(encoding='utf-8')
          commit = re.search(r'^\*\*Production release commit:\*\* `([^`]+)`', status, re.MULTILINE)
          version = re.search(r'^\*\*Visible deployed version:\*\* `([^`]+)`', status, re.MULTILINE)
          if not commit or not version:
              raise RuntimeError('STATUS.md does not expose the accepted production commit/version contract')
          print(commit.group(1))
          print(version.group(1))
          PY
          )
          target_url="${REQUESTED_BASE_URL:-https://project-noclip.vercel.app}"
          target_commit="${REQUESTED_DEPLOYMENT_COMMIT:-${accepted[0]}}"
          target_version="${REQUESTED_EXPECTED_VERSION:-${accepted[1]}}"
          target_id="${REQUESTED_DEPLOYMENT_ID:-canonical-production-${target_version}}"
          echo "NOCLIP_TARGET_URL=${target_url}" >> "$GITHUB_ENV"
          echo "NOCLIP_DEPLOYMENT_COMMIT=${target_commit}" >> "$GITHUB_ENV"
          echo "NOCLIP_DEPLOYMENT_ID=${target_id}" >> "$GITHUB_ENV"
          echo "NOCLIP_EXPECTED_VERSION=${target_version}" >> "$GITHUB_ENV"
          echo "Resolved accepted production target: ${target_commit} / ${target_version} / ${target_id}"
      - name: Run 10,000-cell deterministic benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-profile
          node scripts/benchmark.mjs > artifacts/production-profile/benchmark.json
          cat artifacts/production-profile/benchmark.json
      - name: Install Chromium profiling driver
        run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Profile accepted production runtime
        shell: bash
        run: |
          set -euo pipefail
          NOCLIP_BASE_URL="$NOCLIP_TARGET_URL" \
          NOCLIP_DEPLOYMENT_COMMIT="$NOCLIP_DEPLOYMENT_COMMIT" \
          NOCLIP_DEPLOYMENT_ID="$NOCLIP_DEPLOYMENT_ID" \
          NOCLIP_EXPECTED_VERSION="$NOCLIP_EXPECTED_VERSION" \
          NOCLIP_PROFILE_ARTIFACTS="artifacts/production-profile" \
          python scripts/profile-production.py
      - name: Publish machine-readable profile summary to Issue 14
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/production-profile")
          profile = json.loads((root / "profile.json").read_text(encoding="utf-8"))
          benchmark = json.loads((root / "benchmark.json").read_text(encoding="utf-8"))
          generation = benchmark["generation"]
          navigation = benchmark["navigation"]
          pillar = benchmark["pillar"]
          arch = benchmark["arch"]
          normal_first = benchmark["normalFirst"]
          blackout = benchmark["blackout"]
          holes = benchmark["holeCarver"]
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          runtime_us = float(generation["runtimeMicrosecondsPerCell"])
          cells_per_second = 1_000_000 / runtime_us
          depth_bins = pillar.get("depthBins", [])
          pillar_progression = " → ".join(
              f"{entry['walls']:.3f}w/{entry['columns']:.3f}p" for entry in depth_bins
          ) or "n/a"

          lines = [
              "## Issue #14 production profile: passed", "",
              f"- Public URL: `{profile['baseUrl']}`",
              f"- Accepted deployment commit: `{profile['deployment']['commit']}`",
              f"- Visible version: `{profile['deployment']['version']}`",
              f"- Deployment identity: `{profile['deployment']['id']}`",
              f"- Profiling workflow commit: `{os.environ['GITHUB_SHA']}`",
              f"- Actions evidence: {run_url}",
              f"- Browser: `{profile['environment']['browser'].get('browserVersion', 'unknown')}`",
              f"- WebGL renderer: `{profile['environment']['webgl'].get('renderer', 'unknown')}`",
              "", "### Fixed renderer scenarios",
          ]
          for key, label in (
              ("defaultSpawn", "Default Level 0 spawn · radius 3"),
              ("holeCarverRadius1", "Floor-hole Carver evidence · radius 1"),
              ("worldLabShowcase", f"World Lab · {profile['catalogCount']}-object canonical showcase"),
          ):
              scenario = profile["scenarios"][key]
              frames = scenario["frames"]["frameTimeMs"]
              fps = scenario["frames"]["instantaneousFps"]
              cpu = scenario["cpu"]
              metrics = scenario["worldMetricsAfter"]
              lines.append(
                  f"- **{label}:** frame p50 `{frames['median']:.3f} ms`, p95 `{frames['p95']:.3f} ms`, "
                  f"median FPS `{fps['median']:.2f}`, main-thread busy `{cpu.get('mainThreadBusyPct', 'n/a')}%`, "
                  f"draw calls `{metrics.get('drawCalls', 'n/a')}`, loaded Cells `{metrics.get('loadedCells', 'n/a')}`"
              )

          streaming = profile["scenarios"]["boundedStreamingBands"]
          lines.extend([
              "", "### Streaming and current-branch generator evidence",
              f"- Deterministic World Lab streaming cycle: `{' → '.join(map(str, streaming['loadedCellsSequence']))}` loaded Cells; peak `{streaming['peakCellsUnloaded']}` unloaded and `{streaming['peakCellsReloaded']}` reloaded without mutating journey save data.",
              f"- Radius transition settle times: `{', '.join(str(step['settleMs']) + ' ms' for step in streaming['transitions'])}`.",
              f"- Generation 3 benchmark: `{generation['cells']}` Cells / `{runtime_us:.2f} µs/Cell` runtime / `{cells_per_second:.2f} Cells/s`; validation `{generation['validationMicrosecondsPerCell']:.2f} µs/Cell` separately; placement errors `{generation['placementErrors']}`.",
              f"- Raw finite-window navigation diagnostic: reachable `{navigation['reachableAreaRatio']:.4f}`, isolated `{navigation['isolatedAreaRatio']:.4f}`, open-space P50/P90 `{navigation['openAreaP50']:.2f}/{navigation['openAreaP90']:.2f} m²`, mean `{navigation['cellsCrossed']:.1f}` Cells crossed; all boundaries reached `{navigation['allBoundaryReached']}`.",
              f"- Pillar: exact width scale `{pillar['widthScale']:.2f}` (`{pillar['minWidth']:.3f}–{pillar['maxWidth']:.3f} m`); common `{pillar['commonWallsPerCell']:.3f}` walls / `{pillar['commonColumnsPerCell']:.3f}` pillars per Cell; depth progression `{pillar_progression}`.",
              f"- Arch: `{arch['dividerSamples']}` divider samples, `{arch['distinctBayWidths']}` distinct intentional bay widths, `{arch['routeDividers']}` route dividers, minimum route width `{arch['minimumRouteWidth']:.4f} m`. Normal-first disorienting rate `{normal_first['disorientingRate']:.4f}` / flicker-group rate `{normal_first['flickerGroupRate']:.4f}`.",
              f"- Blackout local light groups `{blackout['localLightGroups']}`, hole overlaps `{holes['overlaps']}`, boundary max Δ `{benchmark['geographyBoundaryDelta']}`.",
              f"- Save/reload: schema v{profile['saveReload']['version']} / `{profile['saveReload']['generationVersion']}` preserved, position delta `{profile['saveReload']['positionDeltaMeters']:.4f} m`.",
              f"- Browser console errors: `{len(profile.get('browserErrors', []))}`.",
              "",
              "The deterministic benchmark comes from the workflow commit; the browser profile above targets the accepted production deployment resolved from STATUS.md.",
              "Headless CI uses SwiftShader, so its absolute FPS is a software-renderer stress observation rather than a physical-GPU FPS claim.",
              "The artifact contains `profile.json`, `benchmark.json`, and available scenario screenshots. This workflow does not modify the deployed game runtime.",
          ])
          for warning in profile.get("warnings", []):
              lines.append(f"- Non-blocking evidence warning: {warning.splitlines()[0]}")
          Path("/tmp/issue-14-profile.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          gh issue comment 14 --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-14-profile.md
      - name: Upload production profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-profile-${{ github.sha }}
          path: artifacts/production-profile
          if-no-files-found: warn
          retention-days: 30
