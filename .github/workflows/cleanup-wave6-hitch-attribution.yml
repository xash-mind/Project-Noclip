name: Cleanup Wave 6 Hitch Attribution

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NOCLIP_WAVE5_ATTRIBUTION_BASE_SHA: 4c16a3770d7f29476626062cda6dd13850aa805b

jobs:
  matched-hitch-attribution:
    name: matched-hitch-attribution-${{ matrix.pair }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3]
    env:
      NOCLIP_BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check selenium==4.46.0
      - name: Build exact candidate and Wave 5 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NOCLIP_BRANCH_HEAD_SHA"
          npm install --no-audit --no-fund
          npm run build
          BASE_DIR="/tmp/noclip-wave5-attribution-${{ matrix.pair }}"
          git fetch --no-tags --depth=1 origin "$NOCLIP_WAVE5_ATTRIBUTION_BASE_SHA"
          git worktree add --detach "$BASE_DIR" "$NOCLIP_WAVE5_ATTRIBUTION_BASE_SHA"
          test "$(git -C "$BASE_DIR" rev-parse HEAD)" = "$NOCLIP_WAVE5_ATTRIBUTION_BASE_SHA"
          (
            cd "$BASE_DIR"
            npm install --no-audit --no-fund
            npm run build
          )
      - name: Capture same-host hitch attribution
        shell: bash
        run: |
          set -euo pipefail
          PAIR="${{ matrix.pair }}"
          BASE_DIR="/tmp/noclip-wave5-attribution-$PAIR"
          CANDIDATE_DIR="$GITHUB_WORKSPACE"
          ARTIFACT_ROOT="$GITHUB_WORKSPACE/artifacts/hitch-attribution/run-$PAIR"
          mkdir -p "$ARTIFACT_ROOT/candidate" "$ARTIFACT_ROOT/baseline"

          (
            cd "$CANDIDATE_DIR"
            PORT=4173 npm run preview > "/tmp/noclip-wave6-attribution-$PAIR.log" 2>&1
          ) &
          CANDIDATE_PID=$!
          (
            cd "$BASE_DIR"
            PORT=4174 npm run preview > "/tmp/noclip-wave5-attribution-$PAIR.log" 2>&1
          ) &
          BASELINE_PID=$!
          trap 'kill "$CANDIDATE_PID" "$BASELINE_PID" 2>/dev/null || true' EXIT

          for port in 4173 4174; do
            for attempt in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:$port/" >/dev/null; then break; fi
              if [ "$attempt" -eq 30 ]; then echo "Preview server on $port did not become ready" >&2; exit 1; fi
              sleep 1
            done
          done

          run_candidate() {
            cd "$CANDIDATE_DIR"
            NOCLIP_BASE_URL="http://127.0.0.1:4173" \
            NOCLIP_BRANCH_HEAD_SHA="$NOCLIP_BRANCH_HEAD_SHA" \
            NOCLIP_HITCH_ATTRIBUTION_RUN_ID="$PAIR" \
            NOCLIP_HITCH_ATTRIBUTION_SAMPLE_SECONDS="45.0" \
            NOCLIP_HITCH_ATTRIBUTION_ARTIFACTS="$ARTIFACT_ROOT/candidate" \
              python "$CANDIDATE_DIR/scripts/attribute-runtime-hitches.py"
          }

          run_baseline() {
            cd "$BASE_DIR"
            NOCLIP_BASE_URL="http://127.0.0.1:4174" \
            NOCLIP_BRANCH_HEAD_SHA="$NOCLIP_WAVE5_ATTRIBUTION_BASE_SHA" \
            NOCLIP_HITCH_ATTRIBUTION_RUN_ID="$PAIR" \
            NOCLIP_HITCH_ATTRIBUTION_SAMPLE_SECONDS="45.0" \
            NOCLIP_HITCH_ATTRIBUTION_ARTIFACTS="$ARTIFACT_ROOT/baseline" \
              python "$CANDIDATE_DIR/scripts/attribute-runtime-hitches.py"
          }

          if (( PAIR % 2 == 1 )); then
            run_candidate
            run_baseline
          else
            run_baseline
            run_candidate
          fi

          test -s "$ARTIFACT_ROOT/candidate/hitch-attribution.json"
          test -s "$ARTIFACT_ROOT/baseline/hitch-attribution.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-wave6-hitch-attribution-${{ matrix.pair }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/hitch-attribution
          if-no-files-found: warn
          retention-days: 14
