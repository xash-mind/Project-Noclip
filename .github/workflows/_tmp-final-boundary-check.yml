name: Temporary Final Boundary Check
on:
  push:
    branches: [cleanup/codebase-maintainability-2026-08-14]
permissions:
  contents: write
jobs:
  profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Prepare exact revisions
        run: |
          git worktree add /tmp/before 2a183c9cdcd9ad4089e0f4261e276ae82a8efc23
          git worktree add /tmp/after 8bb69ef
          cp scripts/_tmp_final_boundary_check.py /tmp/check.py
          python - <<'PY'
          from pathlib import Path
          for root in (Path('/tmp/before'),Path('/tmp/after')):
            p=root/'src/main.ts';t=p.read_text();n='const game = new ProjectNoclipGame();\n';assert n in t;p.write_text(t.replace(n,n+"(window as unknown as { __testGame?: ProjectNoclipGame }).__testGame = game;\n",1))
          PY
      - name: Build
        run: |
          (cd /tmp/before && npm install --no-audit --no-fund && npm run build)
          (cd /tmp/after && npm install --no-audit --no-fund && npm run build)
      - name: Serve
        run: |
          (cd /tmp/before && PORT=4173 npm run preview >/tmp/before.log 2>&1 &)
          (cd /tmp/after && PORT=4174 npm run preview >/tmp/after.log 2>&1 &)
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && curl -fsS http://127.0.0.1:4174 >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: python -m pip install --disable-pip-version-check selenium
      - run: python /tmp/check.py
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: final-boundary-check, path: artifacts/final-boundary-check, if-no-files-found: warn}
      - name: Remove harness
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/_tmp-final-boundary-check.yml scripts/_tmp_final_boundary_check.py
          git commit -m "chore: remove final boundary check harness"
          git push origin HEAD:cleanup/codebase-maintainability-2026-08-14
