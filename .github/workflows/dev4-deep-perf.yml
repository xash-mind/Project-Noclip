name: Finalize deep Pillar and solver range
on:
  push:
    branches: [agent/dev4-world-coherence]
    paths: ['.github/workflows/dev4-deep-perf.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dev4-world-coherence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/world/gen3Architecture.ts')
          t=p.read_text(encoding='utf-8')
          start=t.index('  const deepPillar = pillar', t.index('function regionInfluenceFromLocal'))
          end=t.index('  return { pillar, arch, deepPillar: clamp01(deepPillar) };', start)
          end=t.index('\n', end)+1
          replacement="""  // Deep Pillar territory is a rare continuous extreme inside an otherwise mixed
            // Pillar Region. A smooth combined potential creates coherent, genuinely large
            // deep cores while keeping them a small minority of total Pillar traversal.
            const deepPotential = local.openness * 0.45 + local.regularity * 0.35 + local.columnPressure * 0.2;
            const deepPillar = strength(pillar, 0.62, 0.9) * strength(deepPotential, 0.52, 0.72);
            return { pillar, arch, deepPillar: clamp01(deepPillar) };
          """
          t=t[:start]+replacement+t[end:]
          t=t.replace("const pillarSuppression = influence.pillar * 0.12 + influence.deepPillar * 0.5;", "const pillarSuppression = influence.pillar * 0.12 + influence.deepPillar * 0.72;",1)
          t=t.replace("minX: Math.floor((centerX - CELL_SIZE / 2 - padding) / SUBSTRATE_GRID) - 1,", "minX: Math.floor((centerX - CELL_SIZE / 2 - padding) / SUBSTRATE_GRID),",1)
          t=t.replace("maxX: Math.ceil((centerX + CELL_SIZE / 2 + padding) / SUBSTRATE_GRID) + 1,", "maxX: Math.ceil((centerX + CELL_SIZE / 2 + padding) / SUBSTRATE_GRID),",1)
          t=t.replace("minZ: Math.floor((centerZ - CELL_SIZE / 2 - padding) / SUBSTRATE_GRID) - 1,", "minZ: Math.floor((centerZ - CELL_SIZE / 2 - padding) / SUBSTRATE_GRID),",1)
          t=t.replace("maxZ: Math.ceil((centerZ + CELL_SIZE / 2 + padding) / SUBSTRATE_GRID) + 1", "maxZ: Math.ceil((centerZ + CELL_SIZE / 2 + padding) / SUBSTRATE_GRID)",1)
          p.write_text(t,encoding='utf-8')
          for f in ['.github/workflows/dev4-deep-pillar.yml','.github/workflows/dev4-deep-pillar-retry.yml','.github/workflows/dev4-deep-pillar-apply.yml','.github/workflows/dev4-deep-pillar-final.yml','.github/workflows/dev4-deep-perf.yml']:
            q=Path(f)
            if q.exists(): q.unlink()
          PY
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run benchmark
          git config user.name "xash-mind"
          git config user.email "sashreeksagar5@gmail.com"
          git add src .github/workflows
          git commit -m "fix: preserve large rare deep Pillar cores"
          git push origin HEAD:agent/dev4-world-coherence
