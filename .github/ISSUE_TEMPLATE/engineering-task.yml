name: Engineering task
description: Define a ready implementation, refactor, migration, or release task
title: "Task: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or objective
      description: What verified problem or outcome should this work address?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and current state
      description: Include reproduction, affected commit/deployment, logs, screenshots, benchmark, or current limitation.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define the smallest coherent end-to-end change.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: State what should not be bundled into this issue.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Link required issues, decisions, credentials, environments, or prior work.

  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback
      description: What could break, what data/state is at risk, and how can the change be reversed?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable results that prove completion.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Required verification
      description: Include automated, browser, persistence, performance, accessibility, deployment, or domain-specific checks.
    validations:
      required: true

  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness
      options:
        - label: The problem or objective has been verified against the current repository or deployment.
          required: true
        - label: Product direction and official content are sufficiently defined.
          required: true
        - label: This issue is coherent and does not silently bundle unrelated work.
          required: true
